<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1656" viewBox="0 0 1242 1656">
  <defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#192e3b" flood-opacity=".15"/></filter><clipPath id="a"><rect x="95" y="980" width="315" height="250" rx="20"/></clipPath><clipPath id="b"><rect x="464" y="980" width="315" height="250" rx="20"/></clipPath><clipPath id="c"><rect x="833" y="980" width="315" height="250" rx="20"/></clipPath></defs>
  <rect width="1242" height="1656" fill="#fff7e8"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#183542">
