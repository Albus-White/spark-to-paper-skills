    <text x="70" y="920" font-size="29" font-weight="700">下面三张，都是样例里实际使用的结果图</text>
    <image href="../../figs/plot-pm25.png" x="95" y="980" width="315" height="250" preserveAspectRatio="xMidYMid meet" clip-path="url(#a)"/>
    <image href="../../figs/plot-bearing.png" x="464" y="980" width="315" height="250" preserveAspectRatio="xMidYMid meet" clip-path="url(#b)"/>
    <image href="../../figs/plot-chronic.png" x="833" y="980" width="315" height="250" preserveAspectRatio="xMidYMid meet" clip-path="url(#c)"/>
    <rect x="70" y="1320" width="1102" height="160" rx="34" fill="#fff" stroke="#e5dac6"/>
