    <text x="70" y="190" font-size="72" font-weight="800">不只跑通一次，</text><text x="70" y="280" font-size="72" font-weight="800">我们做了 7 篇完整样例</text>
    <text x="70" y="350" font-size="28" fill="#61747b">覆盖环境、能源、计算机视觉、临床 AI 和故障诊断等方向</text>
    <g filter="url(#s)">
      <rect x="70" y="430" width="1102" height="400" rx="36" fill="#183542"/>
      <text x="150" y="550" font-size="72" font-weight="800" fill="#f3a47d">7</text><text x="150" y="600" font-size="24" fill="#fff">篇论文</text>
      <text x="390" y="550" font-size="72" font-weight="800" fill="#f3a47d">6</text><text x="390" y="600" font-size="24" fill="#fff">个领域</text>
      <text x="620" y="550" font-size="72" font-weight="800" fill="#f3a47d">92</text><text x="620" y="600" font-size="24" fill="#fff">页成稿</text>
      <text x="860" y="550" font-size="72" font-weight="800" fill="#f3a47d">370</text><text x="860" y="600" font-size="24" fill="#fff">条参考文献</text>
      <line x1="120" y1="675" x2="1120" y2="675" stroke="#4d6570"/>
      <text x="120" y="748" font-size="29" font-weight="700" fill="#fff">40 张可编辑矢量图 · 真实实验数据 · 完整编译 PDF</text>
