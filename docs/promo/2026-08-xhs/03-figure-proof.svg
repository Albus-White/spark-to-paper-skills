<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1656" viewBox="0 0 1242 1656">
  <defs><clipPath id="a"><rect x="90" y="500" width="330" height="285" rx="18"/></clipPath><clipPath id="b"><rect x="456" y="500" width="330" height="285" rx="18"/></clipPath><clipPath id="c"><rect x="822" y="500" width="330" height="285" rx="18"/></clipPath></defs>
  <rect width="1242" height="1656" fill="#f7f3eb"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#153945">
    <text x="74" y="98" font-size="25" font-weight="700" fill="#d86437">FIGURES</text>
    <text x="74" y="210" font-size="72" font-weight="800">数据图直接读取真实结果</text>
    <text x="74" y="300" font-size="72" font-weight="800">交付后还能继续编辑</text>
    <text x="74" y="372" font-size="29" fill="#61767d">项目样例中的环境监测、故障诊断与临床预测结果图</text>
