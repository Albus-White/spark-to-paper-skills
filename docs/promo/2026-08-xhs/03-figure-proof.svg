    <image href="../../figs/plot-pm25.png" x="90" y="500" width="330" height="285" preserveAspectRatio="xMidYMid meet" clip-path="url(#a)"/>
    <image href="../../figs/plot-bearing.png" x="456" y="500" width="330" height="285" preserveAspectRatio="xMidYMid meet" clip-path="url(#b)"/>
    <image href="../../figs/plot-chronic.png" x="822" y="500" width="330" height="285" preserveAspectRatio="xMidYMid meet" clip-path="url(#c)"/>
    <text x="144" y="830" font-size="22" font-weight="700">环境监测</text><text x="522" y="830" font-size="22" font-weight="700">故障诊断</text><text x="900" y="830" font-size="22" font-weight="700">临床预测</text>
