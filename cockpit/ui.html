/* Events are whatever the server rendered. Canonical shape is {kind,text,t}; a
   bare string and the {type,message} spelling are accepted so one loose end
   cannot blank the stream. */
function normEvent(e) {
  if (typeof e === "string") return { kind: "assistant", text: e, t: null, label: "" };
  if (!e || typeof e !== "object") return { kind: "system", text: String(e), t: null, label: "" };
  var kind = String(e.kind || e.type || "assistant").toLowerCase();
  var text = e.text;
  if (text === undefined || text === null) text = e.message;
  if (text === undefined || text === null) text = e.content;
  if (text === undefined || text === null) text = "";
  if (typeof text !== "string") { try { text = JSON.stringify(text); } catch (x) { text = String(text); } }
  return { kind: kind, text: text, t: toMs(e.t || e.time || e.ts),
           label: String(e.label || e.tool || e.name || "") };
}
/* BUG 1, fixed: anything not in this map fell through to "system", which was
   esc()-only, which is why literal ** and backticks were visible in the render.
   The prose column is now the most prominent surface in the product. */
var KIND_CLASS = { assistant: "assistant", text: "assistant", prose: "assistant",
  message: "assistant", agent: "assistant", note: "assistant", narration: "assistant",
  tool: "tool", tool_use: "tool", tool_result: "tool",
  user: "user", reply: "user", human: "user",
  error: "error", exception: "error",
  result: "turn", turn: "turn", system: "system", status: "system" };

/* The model narrates in markdown, so a raw dump shows its asterisks and backticks
   to someone reading this for an hour. Escape FIRST — after that there is no raw
   '<' left, so the only tags in the result are the ones these patterns add. */
function proseHTML(text) {
  return esc(text || "")
    .split("\n").map(function (line) {
      var m = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
      if (m) line = m[1] + "· " + m[3];
      return line.replace(/^\s*#{1,6}\s+(.*)$/, "<b>$1</b>");
    }).join("\n")
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,;:)]|$)/g, "$1<i>$2</i>");
}

/* One stamp per minute, not one per line. Twenty identical `00:39`s down a column
   is the log-viewer tell; the slot stays reserved so the lines still align. */
function tsFor(t) {
  if (!t) return '<span class="ts"></span>';
  var c = clock(t);
  if (c === S.lastTs) return '<span class="ts"></span>';
  S.lastTs = c;
  return '<span class="ts">' + esc(c) + "</span>";
}

/* The mask is only honest while there IS more below; content shorter than the
   viewport, or scrolled to the end, must not have its last line dimmed. */
function markScrollEnd(sc) {
  if (!sc) return;
  sc.dataset.atEnd = (sc.scrollHeight - sc.scrollTop - sc.clientHeight) < 6 ? "1" : "0";
}

function eventHTML(raw) {
  var e = normEvent(raw);
  var cls = KIND_CLASS[e.kind] || "system";
  var ts = tsFor(e.t);
  var body;
  if (cls === "tool") {
    /* A 240px column truncating from the right shows `C:\Users\terry\spark-to-pa…`
       twelve times — the identical, useless half. Middle-elide anything that is a
       bare path so the FILENAME survives, and leave commands alone. */
    var arg = e.text;
    if (/^[A-Za-z]:[\\/]|^[\\/]/.test(arg) && !/\s/.test(arg)) arg = elidePath(arg);
    body = '<span class="body" title="' + esc((e.label ? e.label + " " : "") + e.text) + '">' +
      (e.label ? '<span class="tname">' + esc(e.label) + "</span> " : "") +
      '<span class="targ">' + esc(arg) + "</span></span>";
    return '<div class="ev tool">' + ts + body + "</div>";
  }
  if (cls === "assistant" || cls === "user") {
    return '<div class="ev ' + cls + '"><div class="body">' + proseHTML(e.text) + "</div></div>";
  }
  if (cls === "error") {
    return '<div class="ev error">' + proseHTML(e.text) + "</div>";
  }
  /* system and turn both go through proseHTML: it escapes first, so it is safe,
     and a stray ** in a system line is as ugly as one in narration. */
  return '<div class="ev ' + cls + '">' + ts +
    '<span class="body">' + proseHTML(e.text) + "</span></div>";
}

/* THE TURN ROW. Prose and the apparatus it produced share one grid row; a new row
   opens when prose returns after machine work, so the two columns stay in
   register down an hour of output without any timestamp arithmetic. */
function newRow(wide) {
  var d = document.createElement("div");
  d.className = "trow" + (wide ? " wide" : "");
  d.innerHTML = '<div class="col-prose"></div><div class="col-app"></div>';
  $("#r-events").appendChild(d);
  return d;
}
function placeEvent(raw) {
  var cls = KIND_CLASS[normEvent(raw).kind] || "system";
  var html = eventHTML(raw);
  var host;
  if (cls === "error") {
    var w = newRow(true);
    host = w.firstChild;             /* .col-prose, which spans the full 848 here */
    S.row = null; S.rowApp = false;
  } else if (cls === "assistant" || cls === "user") {
    if (!S.row) { S.row = newRow(false); S.rowApp = false; }
    else if (S.rowApp) {
      /* Keep filling this row while the apparatus beside it is still taller. The
         two columns stay in register AND the reading column never opens a void —
         which is exactly what a typesetter does with marginal notes. */
      var pc = S.row.firstChild, ac = S.row.lastChild;
      if (pc.offsetHeight + 24 >= ac.offsetHeight) { S.row = newRow(false); S.rowApp = false; }
    }
    host = S.row.firstChild;
  } else {
    if (!S.row) S.row = newRow(false);
    host = S.row.lastChild;
    S.rowApp = true;
  }
  host.insertAdjacentHTML("beforeend", html);
  S.evCount++;
  return host.lastChild;
}

function appendEvents(list) {
  if (!list || !list.length) return;
  var stream = $("#r-events");
  if (!stream) return;
  var empty = $("#r-empty");
  if (empty) empty.remove();
  /* Opacity only, never a translate: at hour two of watching a stream, text that
     slides is nausea. Suppressed during a burst — four lines fading in at once is
     flicker, not feedback. */
  var now = Date.now();
  S.burst = S.burst.filter(function (t) { return now - t < 500; });
  S.burst.push(now);
  var fade = S.stick && S.pane === "stream" && S.burst.length <= 3;
  list.forEach(function (raw) {
    var node = placeEvent(raw);
    if (fade && node && node.classList) node.classList.add("enter");
  });
  /* The newest stamp is how the status line proves it is not frozen. */
  for (var i = list.length - 1; i >= 0; i--) {
    var lastTs = normEvent(list[i]).t;
    if (lastTs) { if (lastTs > S.lastT) S.lastT = lastTs; break; }
  }
  var label = $("#log-label");
  if (label) label.textContent = t("run.logCountPre") + S.evCount + t("run.logCountPost");
  if (S.stick && S.pane === "stream") {
    var sc = $("#r-scroll");
    sc.scrollTop = sc.scrollHeight;
  }
  markScrollEnd($("#r-scroll"));
}

function renderRunChrome() {
  var d = S.run;
  if (!d || S.view !== "run") return;
  var m = meta(S.runId);
  var title = m.title || S.runId;
  var st = d.status || "running";
  $("#r-title").textContent = title;
  $("#strip-title").title = title;
  $("#app").dataset.status = st;
  $("#r-chip").hidden = false;
  $("#r-chip").innerHTML = '<span class="dot ' + esc(st) + '"></span>' + esc(statusLabel(st));
  renderFolio(d);
  renderTape(d);
  renderStatusLine();
  renderTelemetry();
  renderShelf();

  var a = d.artifacts || {};
  var hasPdf = !!(a.pdf || a.main_pdf || a["main.pdf"]);
  $("#r-pdf").hidden = !hasPdf;
  $("#r-report").hidden = !a.report;
  $("#r-stop").hidden = !!TERMINAL[st];

  var waiting = !!d.needs_reply;
  /* THE ASK. The question takes the status sentence's slot at the same display
     size, so the two never coexist and the largest type on the page is, by state,
     the question > the sentence > the money. */
  $("#r-ask").hidden = !waiting;
  $("#sb-block").hidden = waiting;
  $("#runview").classList.toggle("asking", waiting);
  if (waiting) {
    $("#r-question").textContent = d.question || t("run.askFallback");
  }
  var box = $("#reply"), send = $("#send");
  box.disabled = !waiting; send.disabled = !waiting;
  /* The note is cleared when a NEW question arrives, not when the last one closes:
     otherwise the poll that lands 1 s after a send erases the "Sent" confirmation. */
  if (waiting && !S.wasWaiting) {
    $("#r-note").textContent = "";
    box.focus();
  }
  if (waiting !== S.wasWaiting) {
    document.title = (waiting ? t("run.needsYouTitle") : "") + title + " · Spark Cockpit";
    setFavicon(waiting);
  }
  S.wasWaiting = waiting;
}

/* One line of code, and the only mechanism that can deliver "unmistakable from a
   glance at the taskbar" while the window is behind something else. */
var FAV_IDLE = $("#fav").getAttribute("href");
var FAV_ASK = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'" +
  "%3E%3Ccircle cx='8' cy='8' r='6' fill='%239B8CD4'/%3E%3C/svg%3E";
function setFavicon(asking) { $("#fav").setAttribute("href", asking ? FAV_ASK : FAV_IDLE); }

/* ── the folio: stage as MAGNITUDE. Fail-closed — an unparseable stage takes the
   numeral and its name off the page and lets the metrics hold the band. ────── */
function renderFolio(d) {
  var p = parseStage(d.stage);
  var f = $("#r-stage"), n = $("#r-stagename");
  if (!p) { f.hidden = true; n.hidden = true; return; }
  f.hidden = false; n.hidden = false;
  f.textContent = p.idx < 0 ? "0" : String(p.idx);
  n.textContent = p.idx < 0 ? t("run.queued") : (p.name || STAGE_LABELS[p.idx] || "");
  $("#r-elapsed").textContent = runElapsed();
  $("#r-cost").textContent = money((d.telemetry || {}).cost_usd);
}

/* ── the foot rule: stage as POSITION. Nine ticks, no labels, and the hairline
   bleeds 100px past each end tick because the instrument brackets the document. */
function renderTape(d) {
  var el = $("#r-tape");
  if (!el) return;
  var p = parseStage(d.stage);
  var kinds = p ? tapeKinds(d.status, p.idx) : [];
  var html = "", i;
  for (i = 0; i < STAGE_N; i++) {
    var k = kinds[i] || "";
    var c = k.indexOf("done") === 0 ? "done" : k.indexOf("cur") === 0 ? "cur" :
            k.indexOf("wait") === 0 ? "wait" : k.indexOf("err") === 0 ? "err" : "";
    /* a finished run has no live 'current' stage — tapeKinds marks every stage
       'done ok'. Flag the most-recent one so the strip still shows, in accent,
       where the work ended, instead of a flat wall of identical done bars. */
    if (d.status === "done" && p && i === p.idx) c += " last";
    var name = (p && i === p.idx ? (p.name || STAGE_LABELS[i]) : STAGE_LABELS[i]);
    html += '<button class="snav ' + c + '" type="button" data-stage="' + i + '" ' +
      'title="' + esc(t("run.stageTipPre") + name + t("run.stageTipPost")) + '">' +
      '<i class="bar"></i><span class="lbl">' + i + ' ' + esc(name) + "</span></button>";
  }
  el.innerHTML = html;
  if (p && p.idx > S.tapeIdx) S.tapeIdx = p.idx;
}

/* Click a stage -> open that stage's io.md log in Files. It is the stage's own
   INPUT / DECISIONS / OUTPUT record, so it answers "what did this step do" more
   fully than the live stream ever can. A stage that has not run has no log; the
   click still lands the user on Files rather than doing nothing. */
function jumpToStage(idx) {
  showPane("tree");
  var tries = 0;
  (function go() {
    if (S.tree) {
      var path = null;
      S.tree.forEach(function (g) {
        (g.files || []).forEach(function (f) {
          var leaf = String(f.path).split(/[\\/]/).pop();
          if (leaf.indexOf(idx + "_") === 0 && /\.io\.md$/.test(leaf)) path = f.path;
        });
      });
      if (path) {
        openFile(path);
        var sel = document.querySelector("#pane-tree .tfile.sel");
        if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: "nearest" });
      }
      return;
    }
    if (tries++ < 40) setTimeout(go, 100);   /* the tree is fetched async */
  })();
}

/* ── the status line ────────────────────────────────────────────────────────
   The whole product's source of trust. It says, in a sentence, what the run is
   doing; when the server has no sentence for us we say which stage it is on, and
   never — under any circumstance — a raw tool line or a log tail. */
function renderStatusLine() {
  var d = S.run || {};
  var el = $("#sb-line");
  if (!el) return;
  var line = d.status_line || (d.telemetry || {}).status_line || "";
  var fallback = false;
  if (!line) {
    fallback = true;
    line = d.stage && d.stage !== "not started"
      ? t("run.stagePre") + d.stage
      : (TERMINAL[d.status] ? t("run.finished") : t("run.startingUp"));
  }
  if (d.status === "waiting") {
    line = fallback ? t("run.waitingReply") : t("run.waitingYouPre") + line;
    fallback = false;
  }
  el.textContent = line;
  el.title = line;
  el.classList.toggle("quiet", fallback);
  $("#sb-dot").className = "dot big " + (d.status || "");

  var age = $("#sb-age");
  age.className = "sb-age";
  if (!S.lastT) { age.textContent = ""; return; }
  var since = Date.now() - S.lastT, live = !TERMINAL[d.status];
  /* The liveness proof, and it degrades toward ADMITTING DOUBT: quiet at 12 s,
     less quiet at 3 m, and by eleven minutes it says out loud that the run may be
     stuck. Five quiet minutes is the exact moment a user starts wondering whether
     it died — better to say it than let them wonder. The state rule does NOT
     change when this happens: the rule reports the server's status, this line
     reports our own inference, and blending two honest signals makes one liar. */
  if (live && since >= 600000) {
    age.className = "sb-age stale";
    age.textContent = t("run.noOutPre") + ago(S.lastT) + t("run.stuckPost");
  } else if (live && since >= 300000) {
    age.className = "sb-age stale";
    age.textContent = t("run.noOutPre") + ago(S.lastT) + t("run.dotPost");
  } else {
    age.textContent = t("run.lastOutPre") + ago(S.lastT) + t("run.lastOutMid") + clock(S.lastT);
  }
}

/* ── THE SHELF: only things that CHANGE ─────────────────────────────────────
   The newest thing the run has physically made is the most emotionally valuable
   content in the product, and the only thing that can honestly fill this column.
   Before the first artifact it holds the run's own spark, so it is never empty. */
function shelfClick(e) {
  var b = e.target.closest ? e.target.closest("[data-path]") : null;
  if (!b) return;
  S.sel = b.dataset.path;
  showPane("tree");
}
function renderShelf() {
  var el = $("#r-shelf");
  if (!el) return;
  var d = S.run || {}, a = d.artifacts || {}, tel = d.telemetry || {};
  var figs = (a.figures || []).filter(function (p) { return /\.png$/i.test(p); });
  if (figs.length && S.figs === null && !S.figsReq) { S.figsReq = true; loadFigures(); }

  var html = "", card = "";
  if (figs.length) {
    var rel = figs[figs.length - 1];
    var label = rel.split(/[\\/]/).pop().replace(/\.png$/i, "");
    var f = null;
    (S.figs || []).forEach(function (x) { if (String(x.label) === label) f = x; });
    card = '<button class="shelf-card" type="button" data-path="' + esc(rel) + '">' +
      '<span class="shelf-thumb"><img src="' + esc(fileURL(rel)) + '" alt=""></span>' +
      '<span class="shelf-t">' + esc(label) + "</span>" +
      '<span class="shelf-f">' + esc(rel) + "</span>" +
      (f ? '<span class="shelf-badge">' + badgeHTML(f) + "</span>" : "") +
      "</button>";
  } else if (a.pdf) {
    card = '<button class="shelf-card" type="button" data-path="' + esc(a.pdf) + '">' +
      '<span class="shelf-t">' + esc(t("shelf.thePaper")) + '</span>' +
      '<span class="shelf-f">' + esc(a.pdf) + "</span></button>";
  } else {
    if (!S.sparkReq && a.proposal) {
      S.sparkReq = true;
      var id = S.runId;
      fetch(fileURL(a.proposal)).then(function (r) { return r.text(); }).then(function (txt) {
        if (S.runId !== id) return;
        S.spark = txt;
        renderShelf();
      }).catch(function () { /* the shelf simply keeps its chips */ });
    }
    card = '<div class="shelf-spark">' + esc(S.spark || t("shelf.sparkFrom")) + "</div>" +
      '<div class="shelf-chips">' +
        '<span class="chip">' + esc(tel.model || t("shelf.defaultModel")) + "</span>" +
        '<span class="chip">' + esc(tel.effort || t("shelf.defaultEffort")) + "</span>" +
        '<span class="chip">' + esc(tel.remote || t("shelf.thisMachine")) + "</span>" +
      "</div>";
  }
  html += card;

  var made = [];
  if (a.pdf && figs.length) made.push([a.pdf, 1]);
  (a.sections || []).slice().reverse().forEach(function (p) { made.push([p, 0]); });
  if (made.length) {
    html += '<div class="shelf-list"><h3>' + esc(t("shelf.written")) + '</h3>' +
      made.slice(0, 12).map(function (r) {
        return '<button class="shelf-row' + (r[1] ? " lead" : "") + '" type="button" ' +
          'data-path="' + esc(r[0]) + '"><span>' +
          esc(String(r[0]).split(/[\\/]/).pop()) + "</span></button>";
      }).join("") + "</div>";
  }
  el.innerHTML = html;
}

/* ── THE LEDGER SHEET ───────────────────────────────────────────────────────
   Sixteen values, three tiers, and every one of the old hover tooltips printed as
   a visible line. The audience is academics on Windows, not developers: nobody
   discovers a hover tooltip on a value they cannot name. Cost and elapsed are NOT
   here — they were promoted to 21px in the standfirst. */
function ledgerRow(k, v, gloss) {
  return '<div class="lrow"><div class="lk"><span>' + esc(k) + "</span><b>" + esc(v) + "</b></div>" +
    (gloss ? '<div class="lg">' + esc(gloss) + "</div>" : "") + "</div>";
}
function cell(k, v, title) { return ledgerRow(k, v, title); }   /* kept: same contract */

function renderTelemetry() {
  var main = $("#tm-main");
  if (!main) return;
  var d = S.run || {}, tel = d.telemetry || {}, h = d.health || {};
  var tok = tel.tokens || {}, models = tel.models || {};
  var names = Object.keys(models);
  var head = tel.model || (names.length ? names[0] : "—");
  var others = names.filter(function (n) { return n !== head; });

  var live = [
    cell(t("tm.in"), tokfmt(tok.in), t("tm.in.g")),
    cell(t("tm.out"), tokfmt(tok.out), t("tm.out.g")),
    cell(t("tm.turns"), tel.turns === null || tel.turns === undefined ? "—" : String(tel.turns),
         t("tm.turns.g")),
    cell(t("tm.cache"), t("tm.read") + " " + tokfmt(tok.cache_read) + " · " + t("tm.write") + " " + tokfmt(tok.cache_write),
         t("tm.cache.g"))
  ];
  var pe = tel.plugin_errors || [];
  if (pe.length) {
    live.push('<div class="lrow"><div class="lk"><span>' + esc(t("tm.plugins")) + '</span>' +
      '<b><span class="chip bad">' + pe.length + esc(t("tm.pluginErr")) +
      (LANG === "en" && pe.length > 1 ? "s" : "") + "</span></b></div>" +
      '<div class="lg">' + esc(pluginErrors(pe)) + "</div></div>");
  }
  var den = h.permission_denials || tel.permission_denials || 0;
  if (den) {
    live.push('<div class="lrow"><div class="lk"><span>' + esc(t("tm.refused")) + '</span>' +
      '<b><span class="chip warn">' + den + esc(t("tm.denial")) +
      (LANG === "en" && den > 1 ? "s" : "") + "</span></b></div>" +
      '<div class="lg">' + esc(t("tm.refused.g")) + "</div></div>");
  }
  if (h.api_error) {
    live.push('<div class="lrow"><div class="lk"><span>' + esc(t("tm.api")) + '</span>' +
      '<b><span class="chip bad">' + esc(t("tm.apiErr")) + '</span></b></div>' +
      '<div class="lg">' + esc(h.api_error) + "</div></div>");
  }
  main.innerHTML = live.join("");

  $("#tm-sub").innerHTML = [
    cell(t("tm.contextWindow"), big(tel.context_window), t("tm.contextWindow.g")),
    cell(t("tm.stopReason"), h.stop_reason || "—", t("tm.stopReason.g"))
  ].join("");

  /* BUG 2, fixed: effort and compute were concatenated into one array element, so
     `compute` was absent from every shipped render. It has its own row now. */
  $("#tm-fixed").innerHTML = [
    cell(t("tm.model"), head, t("tm.model.g")),
    cell(t("tm.effort"), tel.effort || t("effort.default"), t("tm.effort.g")),
    cell(t("tm.compute"), tel.remote || t("shelf.thisMachine"),
         tel.remote ? t("tm.compute.gRemotePre") + tel.remote + t("tm.compute.gRemotePost")
                  : t("tm.compute.gLocal")),
    cell(t("tm.permissions"), tel.permission_mode || "—", t("tm.permissions.g")),
    cell(t("tm.auth"), tel.api_key_source === "none" ? t("tm.subscription") : (tel.api_key_source || "—"),
         t("tm.auth.g")),
    cell(t("tm.cli"), tel.claude_code_version || "—", t("tm.cli.g")),
    cell(t("tm.skills"), tel.skills_loaded === null || tel.skills_loaded === undefined
         ? "—" : String(tel.skills_loaded), t("tm.skills.g")),
    '<div class="lrow"><div class="lk"><span>' + esc(t("tm.store")) + '</span><b id="r-wd" title="' +
      esc(d.workdir || "") + '">' + esc(elidePath(d.workdir) || "—") + "</b></div>" +
      '<div class="lg">' + esc(t("tm.store.g")) + "</div></div>"
  ].join("");

  /* Subagents burn real money on a real model. Folding them away is fine;
     dropping them would misreport the bill. */
  var more = $("#tm-more");
  more.hidden = !others.length;
  if (others.length) {
    more.textContent = (S.moreOpen ? t("tm.hide") : t("tm.show")) + others.length + t("tm.moreModels") +
      (LANG === "en" && others.length > 1 ? "s" : "");
  }
  var mp = $("#tm-models");
  mp.innerHTML = names.map(function (n) {
    var m = models[n] || {};
    return ledgerRow(n, money(m.cost_usd),
      tokfmt(m.in) + " " + t("tm.inShort") + " · " + tokfmt(m.out) + " " + t("tm.outShort") + " · " +
      tokfmt(m.cache_read) + " " + t("tm.cacheReadShort") + " · " + big(m.context_window) + " " + t("tm.contextShort"));
  }).join("");
  mp.hidden = !(S.moreOpen && names.length);
}

function pluginErrors(list) {
  return list.map(function (e) {
    if (typeof e === "string") return e;
    return ((e.plugin ? e.plugin + ": " : "") + (e.message || JSON.stringify(e)));
  }).join("\n\n");
}

function sendReply() {
  var box = $("#reply"), note = $("#r-note"), id = S.runId;
  var text = box.value.trim();
  if (!text || box.disabled) return;
  box.disabled = true; $("#send").disabled = true;
  note.className = "reply-note";
  note.textContent = t("reply.sending");
  postJSON("/api/run/" + encodeURIComponent(id) + "/reply", { text: text }).then(function () {
    if (S.runId !== id) return;
    box.value = "";
    $("#r-ask").hidden = true;
    note.textContent = t("reply.sent");
    pollRun();
    pollState();
  }).catch(function (e) {
    if (S.runId !== id) return;
    note.className = "reply-note err";
    note.textContent = e.status === 409
      ? t("reply.notWaiting")
      : t("reply.errPre") + e.message + t("reply.errPost");
    if (e.status !== 409) { box.disabled = false; $("#send").disabled = false; }
  });
}

function stopRun() {
  var id = S.runId;
  $("#r-stop").disabled = true;
  postJSON("/api/run/" + encodeURIComponent(id) + "/stop", {}).then(function () {
    if (S.runId === id) pollRun();
    pollState();
  }).catch(function () {
    if (S.runId === id) $("#r-stop").disabled = false;
  });
}

/* ── figure workbench ───────────────────────────────────────────────────────
   No standfirst, no foot rule, no apparatus, no shelf: a filmstrip index across
   the top and then two 560px panes side by side across the full band. The
   workbench wants width, and here it gets it. */
function loadFigures() {
  var pane = $("#pane-figures"), id = S.runId;
  if (!pane) return;
  if (S.pane === "figures") pane.innerHTML = '<div class="pane-note">' + esc(t("fig.reading")) + '</div>';
  api("/api/run/" + encodeURIComponent(id) + "/figures").then(function (d) {
    if (S.runId !== id) return;
    S.figs = d.figures || [];
    renderFigures();
    renderShelf();          /* the badge on the shelf card arrives with this */
  }).catch(function (e) {
    if (S.runId !== id) return;
    S.figs = [];
    pane.innerHTML = '<div class="pane-note">' + esc(t("fig.noneYetPre") + e.message + t("fig.dot")) + "</div>";
  });
}

/* Hand-drawn marks rather than ✓ / ✗ characters, which resolve to a symbol font
   at the wrong weight and baseline. Shape as well as hue, so the verdict survives
   greyscale — and the one failing cell keeps a SOLID saturated fill, the only one
   in the entire product. */
var MK_OK = '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-check"/></svg>';
var MK_NO = '<svg class="i" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-cross"/></svg>';

function badgeHTML(f) {
  var s = "";
  if (f.font_ok === null || f.font_ok === undefined) {
    s += '<span class="vseg na" title="' + esc(t("badge.fontNa")) + '">/Font —</span>';
  } else if (f.font_ok) {
    s += '<span class="vseg ok" title="' + esc(t("badge.fontOk")) + '">/Font ' + MK_OK + '</span>';
  } else {
    s += '<span class="vseg bad" title="' + esc(t("badge.fontBad")) + '">/Font ' + MK_NO + '</span>';
  }
  if (f.image_free === null || f.image_free === undefined) {
    s += '<span class="vseg na" title="' + esc(t("badge.imageNa")) + '">/Image —</span>';
  } else if (f.image_free) {
    s += '<span class="vseg ok" title="' + esc(t("badge.imageOk")) + '">/Image ' + MK_NO + '</span>';
  } else {
    s += '<span class="vseg bad" title="' + esc(t("badge.imageBad")) + '">/Image ' + MK_OK + '</span>';
  }
  return '<span class="vbadge">' + s + "</span>";
}

function verdict(f) {
  if (f.font_ok == null && f.image_free == null) {
    return ["faint", t("fig.verdictFaint")];
  }
  if (f.font_ok && f.image_free) {
    return ["ok", t("fig.verdictOk")];
  }
  var bad = [];
  if (!f.font_ok) bad.push(t("fig.noRealText"));
  if (!f.image_free) bad.push(t("fig.embeddedBitmap"));
  return ["bad", t("fig.verdictBadPre") + bad.join(" " + t("fig.and") + " ") + t("fig.verdictBadPost")];
}

function figVersions(f) {
  var files = f.files || {};
  var list = (f.versions || []).map(function (rel) {
    return [rel, String(rel).split(/[\\/]/).pop().replace(/\.svg$/i, "")];
  });
  if (files.svg) list.push([files.svg, t("fig.shipped")]);
  return list;
}

/* The figure knows two names: the paper's ("Figure 3", from f.number) and the
   pipeline's internal codename (f.label, e.g. "protocol"). The panel must answer
   "which figure, and what does it show" — so number + caption lead, and the
   codename drops to a secondary chip. Both fields arrive from /figures; either
   may be missing (a figure the LaTeX has not placed, a caption not yet written),
   so both degrade: number → "unplaced figure", caption → the codename. */
function figNum(f) {
  var n = f && f.number;
  return (n === null || n === undefined || n === "") ? null : n;
}
function figCaption(f) {
  var c = f && f.caption;
  return (c === null || c === undefined || !String(c).trim()) ? null : String(c);
}
function figHeadText(f) {
  var n = figNum(f);
  return (n === null ? t("fig.unplaced") : t("fig.figure") + n) +
    " — " + (figCaption(f) || String((f && f.label) || "figure"));
}

function renderFigures() {
  var pane = $("#pane-figures");
  if (!pane) return;
  if (!S.figs.length) {
    pane.innerHTML = '<div class="pane-note">' + esc(t("fig.noneYet")) + '</div>';
    return;
  }
  if (!S.figSel || !S.figs.some(function (f) { return String(f.label) === S.figSel; })) {
    S.figSel = String(S.figs[0].label);
  }
  var strip = '<div class="strip-index scrolls">' + S.figs.map(function (f) {
    var label = String(f.label || "figure");
    var png = (f.files || {}).png;
    var n = figNum(f);
    var badge = '<span class="fnum' + (n === null ? " none" : "") + '">' +
      (n === null ? "—" : esc(t("fig.figShort") + n)) + "</span>";
    return '<button class="fthumb' + (label === S.figSel ? " sel" : "") + '" type="button" ' +
      'data-act="pickfig" data-val="' + esc(label) + '" title="' + esc(figHeadText(f)) + '">' +
      '<span class="box">' + badge +
        (png ? '<img src="' + esc(fileURL(png)) + '" alt="">' : "") + "</span>" +
      '<span class="cap">' + esc(label) + "</span></button>";
  }).join("") + "</div>";
  var one = null;
  S.figs.forEach(function (f) { if (String(f.label) === S.figSel) one = f; });
  pane.innerHTML = strip + (one ? figCard(one) : "");
  if (one) syncPanes(String(one.label));
}

function figCard(f) {
  var label = String(f.label || "figure");
  var st = S.figState[label] || (S.figState[label] = { ver: null, zoom: 1 });
  var files = f.files || {};
  var vers = figVersions(f);
  if (st.ver === null) st.ver = vers.length ? vers[vers.length - 1][0] : null;
  var shipped = files.svg || null;
  var v = verdict(f);

  var chips = [];
  if (f.type) chips.push('<span class="chip">' + esc(f.type) + "</span>");
  if (f.engine) chips.push('<span class="chip">' + esc(f.engine) + "</span>");
  if (f.audit_ok === true) chips.push('<span class="chip ok">' + esc(t("fig.auditOk")) + '</span>');
  if (f.audit_ok === false) chips.push('<span class="chip bad">' + esc(t("fig.auditFailed")) + '</span>');
  var rounds = [];
  if (f.critic_rounds) rounds.push(t("fig.critic") + f.critic_rounds);
  if (f.svg_rounds) rounds.push(t("fig.redraw") + f.svg_rounds);

  var note = v[1];
  if (st.ver && shipped && st.ver !== shipped) {
    note += "  " + t("fig.mismatchNote");
  }

  var n = figNum(f);
  var head = n === null ? t("fig.unplaced") : t("fig.figure") + n;
  var cap = figCaption(f) || label;   /* no caption yet → show the codename */

  return '<div class="fig" data-fig="' + esc(label) + '">' +
    '<div class="fig-head"><h2 class="fig-title">' +
      '<span class="fig-n' + (n === null ? " none" : "") + '">' + esc(head) + "</span>" +
      '<span class="fig-dash"> — </span>' +
      '<span class="fig-cap">' + esc(cap) + "</span></h2></div>" +
    '<div class="fig-sub">' +
      '<span class="fig-code" title="' + esc(t("fig.internalId")) + '">' + esc(label) + "</span>" +
      chips.join("") +
      (rounds.length ? '<span class="chip">' + esc(rounds.join(" · ")) + "</span>" : "") +
      badgeHTML(f) +
    "</div>" +
    '<div class="fig-note ' + v[0] + '">' + esc(note) + "</div>" +
    '<div class="fig-bar">' +
      (vers.length > 1 ? '<span class="sep" style="margin-left:0">' + esc(t("fig.version")) + '</span>' +
        vers.map(function (p) {
          return '<button class="vbtn' + (p[0] === st.ver ? " sel" : "") + '" type="button" ' +
            'data-act="ver" data-val="' + esc(p[0]) + '">' + esc(p[1]) + "</button>";
        }).join("") : "") +
      '<span class="sep">' + esc(t("fig.zoom")) + '</span>' +
      '<span class="stepper">' +
        '<button class="vbtn" type="button" data-act="zoom" data-val="-" title="' + esc(t("fig.zoomOut")) + '">−</button>' +
        '<span class="zoomval" data-zoomval>' + Math.round(st.zoom * 100) + "%</span>" +
        '<button class="vbtn" type="button" data-act="zoom" data-val="+" title="' + esc(t("fig.zoomIn")) + '">+</button>' +
        '<button class="vbtn" type="button" data-act="zoom" data-val="1">' + esc(t("fig.fit")) + '</button>' +
      "</span>" +
    "</div>" +
    '<div class="fig-panes">' +
      pane1(t("fig.origPng"), files.png, st.zoom, "a") +
      pane1(t("fig.redrawSvg"), st.ver, st.zoom, "b") +
    "</div></div>";
}

function pane1(caption, rel, zoom, side) {
  var inner = rel
    ? '<img src="' + esc(fileURL(rel)) + '" alt="' + esc(caption) + '" ' +
      'style="width:' + (zoom * 100) + '%">'
    : '<div class="none">' + esc(t("fig.notProduced")) + '</div>';
  return "<figure><figcaption>" + esc(caption) + "</figcaption>" +
    '<div class="zoombox scrolls" data-side="' + side + '">' + inner + "</div></figure>";
}

var ZOOMS = [1, 1.5, 2, 3, 4, 6, 8];

function figClick(e) {
  var btn = e.target.closest ? e.target.closest("[data-act]") : null;
  if (!btn) return;
  if (btn.dataset.act === "pickfig") { S.figSel = btn.dataset.val; renderFigures(); return; }
  var card = btn.closest(".fig");
  if (!card) return;
  var label = card.dataset.fig;
  var st = S.figState[label];
  if (!st) return;
  if (btn.dataset.act === "ver") {
    st.ver = btn.dataset.val;
  } else {
    var i = ZOOMS.indexOf(st.zoom);
    if (i < 0) i = 0;
    st.zoom = btn.dataset.val === "+" ? ZOOMS[Math.min(i + 1, ZOOMS.length - 1)]
            : btn.dataset.val === "-" ? ZOOMS[Math.max(i - 1, 0)] : 1;
  }
  var f = null;
  for (var k = 0; k < S.figs.length; k++) if (String(S.figs[k].label) === label) f = S.figs[k];
  if (!f) return;
  card.outerHTML = figCard(f);
  syncPanes(label);
}

/* One zoom, two panes, one scroll position: the comparison only means anything if
   both sides are showing the same corner of the picture. */
function syncPanes(label) {
  var card = document.querySelector('.fig[data-fig="' + (window.CSS && CSS.escape
    ? CSS.escape(label) : label) + '"]');
  if (!card) return;
  var boxes = card.querySelectorAll(".zoombox");
  if (boxes.length !== 2) return;
  var busy = false;
  function mirror(from, to) {
    return function () {
      if (busy) return;
      busy = true;
      var mx = from.scrollWidth - from.clientWidth, my = from.scrollHeight - from.clientHeight;
      var tx = to.scrollWidth - to.clientWidth, ty = to.scrollHeight - to.clientHeight;
      if (mx > 0) to.scrollLeft = (from.scrollLeft / mx) * tx;
      if (my > 0) to.scrollTop = (from.scrollTop / my) * ty;
      busy = false;
    };
  }
  boxes[0].addEventListener("scroll", mirror(boxes[0], boxes[1]));
  boxes[1].addEventListener("scroll", mirror(boxes[1], boxes[0]));
}

/* ── artifact browser: a 240px index and an 872px reader ─────────────────── */
var TEXTY = { tex: 1, bib: 1, json: 1, md: 1, log: 1, txt: 1, csv: 1, sh: 1, py: 1 };
var IMAGEY = { png: 1, svg: 1, jpg: 1, jpeg: 1, gif: 1 };
var TEXT_CAP = 200000;

function loadTree() {
  var pane = $("#pane-tree"), id = S.runId;
  if (!pane) return;
  pane.innerHTML = '<div class="pane-note">' + esc(t("tree.readingFolder")) + '</div>';
  api("/api/run/" + encodeURIComponent(id) + "/tree").then(function (d) {
    if (S.runId !== id) return;
    var groups = (d.stages || []).slice();
    var other = d.other || [];
    if (other.length) {
      /* "other" is either a group list or a bare file list — take it either way. */
      if (other[0] && other[0].files) groups = groups.concat(other);
      else groups.push({ stage: "other", files: other });
    }
    S.tree = groups;
    renderTree();
  }).catch(function (e) {
    if (S.runId !== id) return;
    pane.innerHTML = '<div class="pane-note">' + esc(t("tree.nothingPre") + e.message + t("fig.dot")) + "</div>";
  });
}

function renderTree() {
  var pane = $("#pane-tree");
  if (!pane) return;
  var n = S.tree.reduce(function (a, g) { return a + (g.files || []).length; }, 0);
  if (!n) { pane.innerHTML = '<div class="pane-note">' + esc(t("tree.empty")) + '</div>'; return; }
  var list = S.tree.map(function (g) {
    if (!(g.files || []).length) return "";
    return '<div class="tree-group">' +
      '<div class="legend-row" style="margin-bottom:8px"><h3 class="legend">' +
      esc(g.stage || t("tree.filesGroup")) + '</h3><i class="rule"></i></div>' +
      g.files.map(function (f) {
        return '<button class="tfile' + (f.path === S.sel ? " sel" : "") + '" type="button" ' +
          'data-path="' + esc(f.path) + '" title="' + esc(f.path) + '">' +
          "<span>" + esc(String(f.path).split(/[\\/]/).pop()) + "</span>" +
          (f.size ? '<span class="sz">' + esc(bytes(f.size)) + "</span>" : "") + "</button>";
      }).join("") + "</div>";
  }).join("");
  pane.innerHTML = '<div class="browser"><div>' + list + "</div>" +
    '<div id="pv"><div class="pane-note">' + esc(t("tree.pickFile")) + '</div></div></div>';
  /* An 872px reader saying "pick a file" is 60% of the screen spent on an
     instruction. Open the most useful thing the run has and let the index argue. */
  if (!S.sel) {
    var all = [];
    S.tree.forEach(function (g) { (g.files || []).forEach(function (f) { all.push(f.path); }); });
    var want = ["main.tex", "proposal.md"];
    for (var w = 0; w < want.length && !S.sel; w++) {
      for (var i = 0; i < all.length; i++) {
        if (String(all[i]).split(/[\\/]/).pop() === want[w]) { S.sel = all[i]; break; }
      }
    }
    if (!S.sel && all.length) S.sel = all[0];
  }
  if (S.sel) openFile(S.sel);
}

function treeClick(e) {
  var b = e.target.closest ? e.target.closest(".tfile") : null;
  if (b) openFile(b.dataset.path);
}

function openFile(path) {
  S.sel = path;
  var pane = $("#pane-tree");
  var btns = pane.querySelectorAll(".tfile");
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle("sel", btns[i].dataset.path === path);
  var pv = $("#pv");
  if (!pv) return;
  var ext = (path.split(".").pop() || "").toLowerCase();
  var url = fileURL(path);
  var head = '<div class="pv-head"><span class="pv-path">' + esc(path) + "</span>" +
    '<a class="btn sm" style="margin-left:auto" href="' + esc(url) + '" download>' + esc(t("file.download")) + '</a></div>';

  if (ext === "pdf") {
    pv.innerHTML = head + '<div class="pv-body"><iframe src="' + esc(url) + '" title="' +
      esc(path) + '"></iframe></div>';
  } else if (IMAGEY[ext]) {
    pv.innerHTML = head + '<div class="pv-body"><img src="' + esc(url) + '" alt="' +
      esc(path) + '"></div>';
  } else if (TEXTY[ext]) {
    pv.innerHTML = head + '<div class="pv-body"><pre class="pane-note">' + esc(t("file.reading")) + '</pre></div>';
    fetch(url).then(function (r) { return r.text(); }).then(function (txt) {
      if (S.sel !== path) return;
      var cut = txt.length > TEXT_CAP;
      var body = cut ? txt.slice(0, TEXT_CAP) + t("file.truncated") : txt;
      $("#pv .pv-body").innerHTML = "<pre>" + esc(body) + "</pre>";
    }).catch(function () {
      if (S.sel === path) $("#pv .pv-body").innerHTML = '<pre>' + esc(t("file.readFail")) + '</pre>';
    });
  } else {
    pv.innerHTML = head + '<div class="pane-note">' + esc(t("file.noPreview")) + '</div>';
  }
}

/* ── settings: one 640px column, no standfirst, no foot rule ─────────────── */
function loadSettings(show) {

    S.settings = d;
    fillRunSelects();

  }).catch(function (e) {

}

function showSettings() {

        '<span id="set-back-label">' + esc(t("set.back")) + '</span></button>' +
      '<h1 class="vhead">' + esc(t("set.vhead")) + '</h1>' +

      '<div id="set-body"><div class="pane-note">' + esc(t("set.reading")) + '</div></div>' +

/* Leave settings for wherever the user was: the originating run if it still

function closeSettings() {

/* Settings groups are described by the server (serve.py SETTINGS_GROUPS), so
   their title/why arrive in English regardless of UI language. Keep the server
   the source of the group set and its keys, but localise the two human strings
   here, keyed by the stable group key — fall back to the server text if a key
   is unknown or the language is English. Variable NAMES (TS_FIG_*, …) are ids
   and stay verbatim, like model ids and paths. */
var SETGRP_ZH = {
  figure:   { title:"图像模型", why:"绘制示意图。没有它就跳过图表阶段。" },
  vision:   { title:"视觉问答", why:"回看渲染出的图,修正其中的文字并发现缺陷。" },
  embed:    { title:"向量嵌入 + 知识图谱", why:"基于知识图谱的召回与新颖性核查。可选 —— 缺失时降级为网页搜索。" },
  overleaf: { title:"Overleaf", why:"把完成的论文推送到 Overleaf 工程。" },
  raster:   { title:"位图兜底", why:"本地矢量化器,仅在原生 SVG 重绘无法收敛时启用。" },
  remote:   { title:"远程服务器", why:"把一台机器交给实验阶段。填你自己 ~/.ssh/config 里的别名 —— ssh 已经知道主机、端口和密钥,所以这里没有任何凭据,也不会存储。" }
};
function groupTitle(g) {
  var z = LANG === "zh" && SETGRP_ZH[g.key];
  return (z && z.title) || g.title || g.key;
}
function groupWhy(g) {
  var z = LANG === "zh" && SETGRP_ZH[g.key];
  return (z && z.why) || g.why || "";
}
function groupCard(g) {
  var hosts = ((S.settings || {}).ssh_hosts) || [];
  var vars = (g.vars || []).map(function (v) {
    var set = !!v.set;
    var input;
    if (v.name === "TS_REMOTE_HOST" && hosts.length) {
      /* ssh already holds the host, port and key behind the alias — pick, do not retype. */
      var cur = v.value || "";
      input = '<select data-var="' + esc(v.name) + '"><option value="">' + esc(t("set.pickHost")) + '</option>' +
        hosts.map(function (h) {
          return '<option value="' + esc(h) + '"' + (h === cur ? " selected" : "") + ">" +
                 esc(h) + "</option>";
        }).join("") +
        (cur && hosts.indexOf(cur) < 0
          ? '<option value="' + esc(cur) + '" selected>' + esc(cur) + esc(t("set.notInSsh")) + "</option>"
          : "") + "</select>";
    } else if (v.secret) {
      input = '<input type="password" data-var="' + esc(v.name) + '" data-secret="1" value="" ' +
        'autocomplete="off" placeholder="' + esc(set ? t("set.alreadySet") : t("set.notSet")) + '">';
    } else {
      input = '<input type="text" data-var="' + esc(v.name) + '" value="' + esc(v.value || "") + '" ' +
        'autocomplete="off" placeholder="' + esc(t("set.notSet")) + '">';
    }
    return '<div class="var"><span class="vname">' + esc(v.name) +
      (v.secret && set ? ' <span class="chip ok">' + esc(t("set.setChip")) + '</span>' : "") + "</span>" + input + "</div>";
  }).join("");
  return '<div class="gcard" data-group="' + esc(g.key) + '">' +
    "<h2>" + esc(groupTitle(g)) + "</h2>" +
    (groupWhy(g) ? '<div class="why">' + esc(groupWhy(g)) + "</div>" : "") +
    '<div class="varlist">' +
    (vars || '<div class="pane-note">' + esc(t("set.noVars")) + '</div>') + "</div>" +
    '<div class="gfoot">' +
      '<button class="btn" type="button" data-act="save">' + esc(t("set.save")) + '</button>' +
      (g.testable === false ? "" :
        '<button class="btn" type="button" data-act="test">' + esc(t("set.test")) + '</button>' +
        '<span class="light" data-light></span>') +
      '<span class="gnote" data-note></span>' +
    "</div></div>";
}

function settingsClick(e) {
  var btn = e.target.closest ? e.target.closest("[data-act]") : null;
  if (!btn) return;
  var card = btn.closest(".gcard");
  var note = card.querySelector("[data-note]"), light = card.querySelector("[data-light]");
  if (btn.dataset.act === "save") {
    var vars = {}, n = 0;
    var inputs = card.querySelectorAll("[data-var]");
    for (var i = 0; i < inputs.length; i++) {
      var el = inputs[i];
      /* A blank secret box means "keep what is there", not "erase it". */
      if (el.dataset.secret && !el.value) continue;
      vars[el.dataset.var] = el.value;
      n++;
    }
    if (!n) { note.className = "gnote"; note.textContent = t("set.nothingToSave"); return; }
    btn.disabled = true;
    note.className = "gnote"; note.textContent = t("set.saving");
    postJSON("/api/settings", { vars: vars }).then(function (d) {
      S.settings = d;
      renderSettings();
      var again = document.querySelector('.gcard[data-group="' + card.dataset.group + '"] [data-note]');
      if (again) { again.className = "gnote ok"; again.textContent = t("set.written"); }
    }).catch(function (err) {
      btn.disabled = false;
      note.className = "gnote bad";
      note.textContent = t("set.saveFailPre") + err.message + t("set.saveFailPost");
    });
    return;
  }
  btn.disabled = true;
  light.className = "light busy";
  note.className = "gnote"; note.textContent = t("set.testing");
  postJSON("/api/settings/test", { group: card.dataset.group }).then(function (r) {
    btn.disabled = false;
    light.className = "light " + (r.ok ? "ok" : "bad");
    note.className = "gnote " + (r.ok ? "ok" : "bad");
    note.textContent = r.detail || (r.ok ? t("set.reachable") : t("set.failed"));
  }).catch(function (err) {
    btn.disabled = false;
    light.className = "light bad";
    note.className = "gnote bad";
    note.textContent = t("set.testFailPre") + err.message + t("set.testFailPost");
  });
}

function openLedger() {
  if (S.view !== "run") return;
  closePops();
  $("#ledger").hidden = false;
  $("#scrim").hidden = false;
  $("#ledger-x").focus();
}

/* The Dashboard opens IN-APP, not in a browser tab: report.html goes into the
   full-bleed overlay's iframe. Reload on every open (blank first, then the URL)
   so a re-opened report is always current, not a stale first paint. */
function openReport() {
  if (S.view !== "run" || !S.runId) return;
  closePops();
  var f = $("#report-frame");
  f.src = "about:blank";
  /* tell build_report.py which language to render, using the app's own lang. */
  f.src = "/api/run/" + encodeURIComponent(S.runId) + "/report?lang=" + LANG;
  $("#report-view").hidden = false;
  $("#report-x").focus();
}
function closeReport() {
  var v = $("#report-view");
  if (!v || v.hidden) return;
  v.hidden = true;
  $("#report-frame").src = "about:blank";   /* stop the load, drop the memory */
}

/* ── polling ────────────────────────────────────────────────────────────── */
function stopRunPoll() {
  if (S.runTimer) { clearTimeout(S.runTimer); S.runTimer = null; }
}

function pollRun() {
  stopRunPoll();
  if (S.view !== "run" || !S.runId) return;
  var id = S.runId, from = S.cursor;
  api("/api/run/" + encodeURIComponent(id) + "?cursor=" + from).then(function (d) {
    if (S.runId !== id || S.view !== "run") return;      /* switched mid-flight */
    conn(true);
    S.run = d;
    /* sendReply and stopRun force a poll, which can race the scheduled one: both
       ask from the same cursor and get the same events back. Append only the part
       past what is already on screen, so a doubled response is a no-op. */
    /* Chrome first, and never behind the stream. Rendering thousands of events
       is the expensive, failure-prone half; if it ever throws, the header must
       still be telling the truth rather than frozen on "waiting for output". */
    renderRunChrome();
    var evs = d.events || [];
    var end = typeof d.cursor === "number" ? d.cursor : from + evs.length;
    if (end > S.cursor) {
      try {
        appendEvents(evs.slice(Math.max(0, S.cursor - from)));
      } catch (e) {
        var st = $("#r-events");
        if (st) st.insertAdjacentHTML("beforeend",
          '<div class="ev error"><div class="body">' + esc("the log could not be rendered: " + (e && e.message || e)) + "</div></div>");
      }
      S.cursor = end;
    }
    if (!TERMINAL[d.status]) S.runTimer = setTimeout(pollRun, 1500);
  }).catch(function () {
    if (S.runId !== id || S.view !== "run") return;
    conn(false);
    S.runTimer = setTimeout(pollRun, 1500);              /* keep trying, quietly */
  });
}

function pollState() {
  return api("/api/state").then(function (d) {
    conn(true);
    S.runs = d.runs || [];
    S.doctor = d.doctor || null;
    S.runsDir = d.runs_dir || "";
    S.sshHosts = d.ssh_hosts || [];
    S.running = typeof d.running === "number" ? d.running
      : S.runs.filter(function (r) { return !TERMINAL[r.status]; }).length;
    renderRail();
    renderDoctor();
    fillRunSelects();   /* the host list arrives with state, often after the form is drawn */
  }).catch(function () { conn(false); });
}

/* ── theme ──────────────────────────────────────────────────────────────────
   system → light → dark, remembered. ?theme=dark on the URL forces one for a
   screenshot without touching storage. */
var THEMES = ["system", "light", "dark"];
function readTheme() {
  var q = /[?&]theme=(system|light|dark)\b/.exec(location.search);
  if (q) return q[1];
  try { var v = localStorage.getItem("cockpit-theme");
        return THEMES.indexOf(v) >= 0 ? v : "system"; } catch (e) { return "system"; }
}
function applyTheme(t) {
  if (t === "system") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  var b = $("#btn-theme");
  if (b) { b.dataset.theme = t; b.title = "Theme: " + t + " — click to change"; }
}
function initTheme() {
  applyTheme(readTheme());
  $("#btn-theme").addEventListener("click", function () {
    var next = THEMES[(THEMES.indexOf(readTheme()) + 1) % THEMES.length];
    try { localStorage.setItem("cockpit-theme", next); } catch (e) { /* private mode */ }
    applyTheme(next);
  });
}
initTheme();
initLang();

/* ── boot ───────────────────────────────────────────────────────────────── */
$("#strip-title").addEventListener("click", openSwitcher);
$("#btn-ledger").addEventListener("click", openLedger);
$("#ledger-x").addEventListener("click", closePops);
$("#scrim").addEventListener("click", closePops);
$("#tm-more").addEventListener("click", function () { S.moreOpen = !S.moreOpen; renderTelemetry(); });
$("#r-tabs").addEventListener("click", function (e) {
  var t = e.target.closest(".tab");
  if (t) showPane(t.dataset.pane);
});
$("#r-report").addEventListener("click", openReport);
$("#report-back").addEventListener("click", closeReport);
$("#report-x").addEventListener("click", closeReport);
$("#r-pdf").addEventListener("click", function () {
  window.open("/api/run/" + encodeURIComponent(S.runId) + "/file?path=main.pdf", "_blank");
});
$("#r-stop").addEventListener("click", stopRun);
$("#btn-new").addEventListener("click", function () { closePops(); showNew(); });
$("#btn-settings").addEventListener("click", showSettings);
$("#sw-list").addEventListener("click", function (e) {
  var row = e.target.closest ? e.target.closest(".sw-row") : null;
  if (row && row.dataset.id) { closePops(); if (row.dataset.id !== S.runId) openRun(row.dataset.id); }
  var empty = e.target.closest ? e.target.closest("#rail-empty") : null;
  if (empty) { closePops(); showNew(); }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    if (!$("#report-view").hidden) { closeReport(); return; }
    /* an open overlay (switcher / ledger / chip pop) always raises the scrim;
       close that first, and only then let Esc leave the settings view. */
    if (!$("#scrim").hidden) { closePops(); return; }
    if (S.view === "settings") { closeSettings(); return; }
    closePops(); return;
  }
  if (e.key !== "i" || e.metaKey || e.ctrlKey || e.altKey) return;
  var a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  if (S.view === "run") { e.preventDefault(); openLedger(); }
});

S.stateTimer = setInterval(pollState, 5000);
S.tickTimer = setInterval(function () {
  if (S.view === "run" && S.run && !TERMINAL[S.run.status]) {
    var el = $("#r-elapsed");
    if (el) el.textContent = runElapsed();
    renderStatusLine();     /* so "no output for 4 m" keeps counting */
  }
}, 1000);

loadSettings(false);        /* one read, to fill the model and effort lists — never polled */
pollState().then(function () {
  /* Land on the run that wants you, else the newest live one, else the form. */
  var p = null;
  for (var i = 0; i < S.runs.length; i++) {
    var r = S.runs[i];
    if (r.needs_reply) { p = r; break; }
    if (!p && !TERMINAL[r.status]) p = r;
  }
  if (!p && S.runs.length) p = S.runs[0];
  if (p) openRun(p.id); else showNew();
});
</script>
</body>
</html>
