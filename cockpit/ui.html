/* ═══ INLINED TYPE ══════════════════════════════════════════════════════════
   IBM Plex Sans 400 / 450 ("Text") / 600 and IBM Plex Mono 400 / 500 — OFL 1.1,
   from github.com/IBM/plex releases (@ibm/plex-sans@1.1.0, @ibm/plex-mono@1.1.0),
   subset to Latin + the handful of symbols this page draws, and inlined below as
   base64 WOFF2. This file therefore issues ZERO network requests, by construction.
   (The only http:// strings in the file are the SVG XML namespace, which is an
   identifier, not an address — browsers never fetch it.)

   Why Plex: it ships a real 450, so the status readout gets weight without the
   faux-bold that ruins a system stack; it shares a skeleton with Plex Mono, so a
   telemetry line has no colour shift between legend and numeral; and it is not
   Inter, so this cannot read as a Linear knockoff.

   Regenerate (fontTools + brotli):
     pyftsubset IBMPlexSans-Regular.ttf --flavor=woff2 --output-file=sans400.woff2 \
       --layout-features='kern,liga,tnum,zero,frac' \
       --unicodes='U+0020-007E,U+00A0-00FF,U+0131,U+0152-0153,U+02C6,U+02DA,U+02DC,
                   U+2000-206F,U+2074,U+20AC,U+2122,U+2190-2193,U+2212,U+2215,U+2248,
                   U+2260,U+2264-2265,U+00D7,U+2713,U+2717'
     pyftsubset IBMPlexMono-Regular.ttf --flavor=woff2 --output-file=mono400.woff2 \
       --layout-features='kern,tnum,zero' \
       --unicodes='U+0020-007E,U+00A0,U+00B7,U+00D7,U+2013-2014,U+2018-201D,U+2026,
                   U+2190-2192,U+2212,U+2713,U+2717'
     python -c "import base64,sys;print(base64.b64encode(open(sys.argv[1],'rb').read()).decode())" sans400.woff2
   Cost: five faces, 73 KB of WOFF2 → 95 KB of base64. Only 400/450/600 sans and
   400/500 mono exist here — nothing else may be used, because a weight the file
   does not contain gets synthesised, and faux-bold Plex looks worse than Segoe UI.

   NO CJK FACE IS INLINED, deliberately: a usable Chinese subset is megabytes.
   Instead every Latin face below carries an explicit unicode-range, so the
   browser can never ask Plex for a CJK codepoint — it falls through, per glyph,
   to the "CJK" face declared after them. The agent narrates in Chinese, so that
   fallback is a decision with a size-adjust tuned to Plex's baseline, not
   whatever the OS happens to pick mid-sentence.

/* The declared CJK fallback. size-adjust pulls YaHei's larger apparent size onto
   Plex's baseline so a mixed Latin/Chinese line stops looking like two fonts.
   It is a tunable, not a derivation — eyeball it on Windows at 125% and 150% DPI:
   starved, raise toward 97; still towering, drop to 91. */
@font-face{font-family:"CJK";font-style:normal;font-weight:400;font-display:swap;size-adjust:94%;
  src:local("Microsoft YaHei UI"),local("Microsoft YaHei"),local("PingFang SC"),
      local("Source Han Sans SC"),local("Noto Sans SC"),local("Hiragino Sans GB");

  src:local("Microsoft YaHei Bold"),local("Microsoft YaHei"),local("PingFang SC Semibold"),
      local("Source Han Sans SC Bold"),local("Noto Sans SC Bold");
  unicode-range:U+2E80-303F,U+3040-30FF,U+3100-9FFF,U+F900-FAFF,U+FE30-FE4F,U+FF00-FFEF}

/* A SECOND CJK family, scoped to the two largest strings in the product. The 94%
   above was eyeballed at ~15px; at 38px and 50px a 6% metric mismatch is 2–3px of
   baseline error on the status sentence and the folio, both usually Chinese. */
@font-face{font-family:"CJK Display";font-style:normal;font-weight:400;font-display:swap;size-adjust:91%;
  src:local("Microsoft YaHei UI"),local("Microsoft YaHei"),local("PingFang SC"),
      local("Source Han Sans SC"),local("Noto Sans SC"),local("Hiragino Sans GB");
  unicode-range:U+2E80-303F,U+3040-30FF,U+3100-9FFF,U+F900-FAFF,U+FE30-FE4F,U+FF00-FFEF}
@font-face{font-family:"CJK Display";font-style:normal;font-weight:600;font-display:swap;size-adjust:91%;
  src:local("Microsoft YaHei Bold"),local("Microsoft YaHei"),local("PingFang SC Semibold"),
      local("Source Han Sans SC Bold"),local("Noto Sans SC Bold");
  unicode-range:U+2E80-303F,U+3040-30FF,U+3100-9FFF,U+F900-FAFF,U+FE30-FE4F,U+FF00-FFEF}

/* ═══ THE COMPOSITION ═══════════════════════════════════════════════════════
   One sheet of warm paper on a desk, clamped between two full-bleed instrument
   rules: the head rule is STATE (3px of colour across the whole window), the foot
   rule is POSITION (nine ticks across the whole window). Between them the sheet
   carries three columns — prose, apparatus, artifacts — separated by 48px of air
   rather than by borders.

   A BORDER IS PERMITTED ONLY WHERE TWO SURFACES OF EQUAL VALUE MEET. Everywhere
   there is a value step, the step is the boundary. That one rule took 31 hairlines
   down to nine.

   Nothing static exceeds 22px anywhere in the app. The two largest objects on the
   screen — a 38px live sentence and a 50px stage numeral — both change during the
   run. The run title, which does not change, is 14px.
   ══════════════════════════════════════════════════════════════════════════ */
:root {
  /* PAGE GUTTER — 100px at the 1360px design width, so the content band is 1160. */
  --gutter: clamp(24px, 7.35vw, 100px);

  /* SPACING — eight values, every one divisible by four. Inside a component 4/8/12;
     between components 20/32; between columns and regions 48/72; the page's outer
     air 120, used once. Odd numbers are banned. */
  --s1:4px; --s2:8px; --s3:12px; --s4:20px; --s5:32px; --s6:48px; --s7:72px; --s8:120px;

  /* TYPE — eight sizes, 4.55:1 top to bottom, no two adjacent sans steps closer
     than 15%. Nothing outside this table. */
  --t-folio:   clamp(38px, 3.7vw, 50px);   /* the stage numeral. ONE user. */
  --t-display: clamp(28px, 2.9vw, 38px);   /* the status sentence, or the question. */
  --t-lead:    22px;                       /* shelf artifact title, settings heads, run rows */
  --t-data:    21px;                       /* elapsed, cost */
  --t-read:    16.5px;                     /* narration, spark, reply, the stale age line */
  --t-ui:      14px;                       /* buttons, inputs, chips, the run title */
  --t-note:    12.5px;                     /* apparatus, paths, ledger values */
  --t-fine:    11px;                       /* the stage name, the /Font /Image badge. Nothing else. */

  --sans:"IBM Plex Sans","CJK","Microsoft YaHei UI","PingFang SC",sans-serif;
  --sans-dp:"IBM Plex Sans","CJK Display","Microsoft YaHei UI","PingFang SC",sans-serif;
  --mono:"IBM Plex Mono","CJK",ui-monospace,"Cascadia Mono",Consolas,monospace;

  /* RADII — three. 0 for rules, ticks and anything full-bleed; 3 for chips and
     marks; 10 for things that are raised. A 10 may contain only a 3 or a 0. */
  --r-mark:3px; --r-lift:10px;
}

/* ── LIGHT = PAPER ON A DESK ───────────────────────────────────────────────
   The desk is warm grey with the page's one gradient used as light: 9/255 top to
   bottom across the largest surface — invisible as a gradient, felt as a room.
   Sheet against desk is 23/255 of value AND ~4% of warm saturation; value plus hue
   is why it separates at arm's length where 8/255 did not. */
:root, :root[data-theme="light"] {
  --ink-rgb:26 24 21;
  --desk:#E4E2DE;
  --desk-light:linear-gradient(180deg,#E8E6E2 0%,#DFDCD7 100%);
  --sheet:#FBFAF8;
  --raise:#FFFFFF;
  --accent:#C0552A; --wait:#5B45A0; --ok:#2F7A4E; --bad:#A93227; --stale:#8A6410;
  --graphite:rgb(var(--ink-rgb)/.42);
  --ink:rgb(var(--ink-rgb)/1);
  --muted:rgb(var(--ink-rgb)/.62);
  --faint:rgb(var(--ink-rgb)/.38);
  --hair:rgb(var(--ink-rgb)/.11);
  --on-accent:#FFFFFF;
  --lift-sheet:0 1px 1px rgb(40 34 26/.04), 0 6px 16px -6px rgb(40 34 26/.10),
               0 24px 48px -24px rgb(40 34 26/.16);
  --lift-pop:0 1px 2px rgb(40 34 26/.06), 0 12px 28px -8px rgb(40 34 26/.18),
             0 32px 64px -28px rgb(40 34 26/.30);
  --glow-state:0 1px 0 rgb(60 45 30/.12);
  --scrim:rgb(60 50 38/.26);
  color-scheme:light;
}
/* ── DARK = AN INSTRUMENT IN A DIM ROOM, EMITTING ──────────────────────────
   Sheet and room are only 13/255 apart, and that is fine, because in dark the
   sheet is not defined by fill — it is defined by a lit top edge plus ambient
   occlusion under it. A lit edge reads as raised far more convincingly than any
   fill delta. No texture: noise in dark reads as dirt. */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ink-rgb:226 231 238;
  --desk:#0A0B0D;
  --desk-light:radial-gradient(120% 80% at 50% -10%, rgb(226 231 238/.035), transparent 70%);
  --sheet:#171A1F;
  --raise:#1E232B;
  --accent:#E2703A; --wait:#9B8CD4; --ok:#7FB58A; --bad:#D9736B; --stale:#C08A22;
  --graphite:rgb(var(--ink-rgb)/.44);
  --muted:rgb(var(--ink-rgb)/.62);
  --faint:rgb(var(--ink-rgb)/.38);
  --hair:rgb(var(--ink-rgb)/.10);
  --on-accent:#14100D;
  --lift-sheet:inset 0 1px 0 rgb(255 255 255/.045), 0 24px 60px -30px #000;
  --lift-pop:inset 0 1px 0 rgb(255 255 255/.055), 0 24px 64px -20px #000;
  --glow-state:0 0 24px -6px color-mix(in oklab, var(--state) 50%, transparent);
  --scrim:rgb(0 0 0/.52);
  color-scheme:dark;
} }
:root[data-theme="dark"] {
  --ink-rgb:226 231 238;
  --desk:#0A0B0D;
  --desk-light:radial-gradient(120% 80% at 50% -10%, rgb(226 231 238/.035), transparent 70%);
  --sheet:#171A1F;
  --raise:#1E232B;
  --accent:#E2703A; --wait:#9B8CD4; --ok:#7FB58A; --bad:#D9736B; --stale:#C08A22;
  --graphite:rgb(var(--ink-rgb)/.44);
  --muted:rgb(var(--ink-rgb)/.62);
  --faint:rgb(var(--ink-rgb)/.38);
  --hair:rgb(var(--ink-rgb)/.10);
  --on-accent:#14100D;
  --lift-sheet:inset 0 1px 0 rgb(255 255 255/.045), 0 24px 60px -30px #000;
  --lift-pop:inset 0 1px 0 rgb(255 255 255/.055), 0 24px 64px -20px #000;
  --glow-state:0 0 24px -6px color-mix(in oklab, var(--state) 50%, transparent);
  --scrim:rgb(0 0 0/.52);
  color-scheme:dark;
}

* { box-sizing:border-box; }
/* Load-bearing: several controls are shown and hidden with the `hidden` property,
   and an author rule like `.btn{display:inline-flex}` outranks the UA's
   `[hidden]{display:none}` — which silently pins #r-pdf open on a run with no PDF. */
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; background:var(--desk); background-image:var(--desk-light);
  background-attachment:fixed; color:var(--ink);
  font-family:var(--sans); font-size:var(--t-ui); line-height:1.5;
  font-variant-numeric:tabular-nums; font-synthesis:none; overflow:hidden;
  -webkit-font-smoothing:antialiased; }
h1,h2,h3 { margin:0; font-weight:inherit; font-size:inherit; }
b, strong { font-weight:600; }
:focus-visible { outline:none; box-shadow:0 0 0 2px var(--sheet), 0 0 0 4px var(--accent);
  border-radius:var(--r-mark); }
::selection { background:color-mix(in oklab, var(--accent) 28%, transparent); }
.scrolls { scrollbar-width:thin; scrollbar-color:rgb(var(--ink-rgb)/.28) transparent; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-thumb { background:rgb(var(--ink-rgb)/.24); border-radius:6px;
  border:2px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-thumb:hover { background:rgb(var(--ink-rgb)/.38); background-clip:content-box; }
::-webkit-scrollbar-track { background:transparent; }

/* ═══ MOTION BUDGET ═════════════════════════════════════════════════════════
   Four keyframes and two transitions, nothing else in the file. Zero elements
   animate at rest: across a ninety-minute run the compositor is idle except for
   at most eight tick transitions, one ask, and a text node ticking once a second
   (tabular, so it cannot reflow). Nothing loops, pulses, shimmers or drifts. */
@keyframes arrive-rule { from { transform:scaleX(0); } to { transform:scaleX(1); } }
@keyframes arrive-tick { from { opacity:0; } to { opacity:1; } }
@keyframes ask-rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
@keyframes ev-in { from { opacity:0; } to { opacity:1; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration:1ms !important; animation-duration:1ms !important;
    animation-delay:0ms !important; }
}

/* ═══ SHELL ═════════════════════════════════════════════════════════════════
   Only three things are full-bleed: the head strip, the state rule, the foot rule.
   Everything else respects the gutter. That bleed is what makes those three read
   as machinery and the sheet read as paper. */
#app { display:flex; flex-direction:column; height:100vh; min-height:0;
  --state:var(--graphite); }
main { flex:1; min-height:0; display:flex; flex-direction:column; }
.runview { flex:1; min-height:0; display:flex; flex-direction:column; }
#app[data-status="running"], #app[data-status="starting"] { --state:var(--accent); }
#app[data-status="waiting"] { --state:var(--wait); }
#app[data-status="error"]   { --state:var(--bad); }

/* ── head strip: 40px, no fill, no bottom border ──────────────────────────── */
.strip { flex:none; height:40px; display:flex; align-items:center; gap:var(--s4);
  padding:0 var(--gutter); min-width:0; }
.strip-mark { color:var(--state); flex:none; display:block; opacity:.9; }
.strip-l { display:flex; align-items:center; gap:var(--s3); min-width:0; }
.strip-r { margin-left:auto; display:flex; align-items:center; gap:var(--s2); flex:none; }
/* Two groups live here — what you DO to this run, and how you look at the app.
   Eight controls at one weight reads as a toolbar; a seam makes it two thoughts. */
.strip-div { width:1px; height:16px; background:var(--line); margin:0 var(--s1); flex:none; }
.strip-r .iconbtn { color:var(--faint); }
.strip-r .iconbtn:hover { color:var(--ink); }
.titlebtn { font:inherit; font-size:var(--t-ui); font-weight:450; color:var(--muted);
  background:none; border:0; padding:0 var(--s1) 0 0; cursor:pointer; max-width:340px;
  display:flex; align-items:center; gap:6px; min-width:0; border-radius:var(--r-mark);
  transition:color 120ms cubic-bezier(.2,0,.38,.9); }
.titlebtn span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.titlebtn:hover { color:var(--ink); }
.titlebtn .i { flex:none; color:var(--faint); }

/* view switching, sentence case, no underline, no accent: rank by ink, not colour */
.nav { display:flex; align-items:center; gap:var(--s3); }
.tab { font:inherit; font-size:var(--t-ui); font-weight:450; background:none; border:0;
  padding:0; cursor:pointer; color:var(--faint); border-radius:var(--r-mark);
  transition:color 120ms cubic-bezier(.2,0,.38,.9); }
.tab:hover { color:var(--muted); }
.tab.sel { color:var(--ink); font-weight:500; }

.schip { display:inline-flex; align-items:center; gap:7px; font-size:var(--t-ui);
  color:var(--muted); white-space:nowrap; }
.tray { display:flex; align-items:center; gap:5px; }
.envchip { font-family:var(--mono); font-size:11px; letter-spacing:.01em;
  padding:3px 8px; border-radius:var(--r-mark); white-space:nowrap; align-self:center; }
.envchip.ok  { color:var(--ok);  background:color-mix(in oklab,var(--ok) 12%,transparent); }
.envchip.bad { color:var(--bad); background:color-mix(in oklab,var(--bad) 15%,transparent);
  font-weight:600; }

/* ── the state rule: 3px of colour across the whole window ────────────────── */
.rule-state { flex:none; height:3px; background:var(--state); box-shadow:var(--glow-state);
  transform-origin:left; }

/* ── the sheet ────────────────────────────────────────────────────────────── */
.sheet { flex:1; min-height:0; display:flex; flex-direction:column;
  background:var(--sheet); box-shadow:var(--lift-sheet); }

/* ── STANDFIRST — 196px: the sentence, and the folio ──────────────────────── */
/* the one padding in the file that is not on the eight-step scale: 40 and 26 are
   what the 196px standfirst band is made of, and the band is the composition */
.standfirst { flex:none; position:relative; padding:40px var(--gutter) 26px;
  display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:var(--s6);
  align-items:start; }
#sb-dot { position:absolute; left:calc(var(--gutter) - 28px); top:52px; }
.sb-line { font-family:var(--sans-dp); font-size:var(--t-display); font-weight:450;
  line-height:1.30; letter-spacing:-.015em; max-width:19em; overflow-wrap:anywhere;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.sb-line.quiet { color:var(--muted); }
/* THE ONLY ELEMENT IN THE APP THAT GROWS AS AN ALARM. */
.sb-age { font-size:var(--t-ui); color:var(--muted); margin-top:10px; }
.sb-age.stale { font-size:var(--t-read); color:var(--stale); }
.ask-eyebrow { font-size:var(--t-ui); font-weight:500; color:var(--wait); margin-bottom:var(--s2); }
#r-question { font-family:var(--sans-dp); font-size:var(--t-display); font-weight:450;
  line-height:1.30; letter-spacing:-.015em; max-width:19em; overflow-wrap:anywhere; }
.asking .ask-block { animation:ask-rise 180ms cubic-bezier(.2,.7,.3,1) 1; }

.folio-stack { text-align:right; min-width:200px; }
.folio { font-family:var(--mono); font-size:var(--t-folio); font-weight:500; line-height:1;
  letter-spacing:-.02em; margin-top:-4px; display:block; }
.stage-name { font-family:var(--mono); font-size:var(--t-fine); font-weight:500;
  letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:var(--s2); }
.metrics { font-family:var(--mono); font-size:var(--t-data); font-weight:500; line-height:1.1;
  letter-spacing:-.01em; margin-top:var(--s3); white-space:nowrap; }
.metrics .sep { color:var(--faint); margin:0 6px; }

/* ── the sheet's scrolling body: prose | apparatus | shelf ────────────────── */
/* The sheet runs under the foot rule, so its last line is always cut mid-glyph.
   A short mask says "this continues" instead of leaving it looking chopped. */
.sheet-scroll { flex:1; min-height:0; overflow-y:auto; padding:0 var(--gutter) var(--s7);
  -webkit-mask-image:linear-gradient(to bottom, #000 calc(100% - 34px), transparent 100%);
  mask-image:linear-gradient(to bottom, #000 calc(100% - 34px), transparent 100%); }
/* Scrolled to the end there is nothing to fade, and a fade there would dim the
   final line of a finished run — the one line the reader most wants intact. */
.sheet-scroll[data-at-end="1"] { -webkit-mask-image:none; mask-image:none; }
.sheet-body { display:grid; grid-template-columns:minmax(0,848px) 264px;
  column-gap:var(--s6); justify-content:start; align-items:start; }
.shelf { position:sticky; top:0; padding-top:var(--s1); }

/* One grid row per turn, so the apparatus flows beside the prose it belongs to
   rather than floating as an independent list. */
.trow { display:grid; grid-template-columns:minmax(0,560px) 240px; column-gap:var(--s6);
  align-items:start; }
.trow + .trow { margin-top:var(--s4); }
.trow.wide { grid-template-columns:minmax(0,848px); }
.col-prose { grid-column:1; min-width:0; }
.col-app { grid-column:2; min-width:0; }
.trow.wide .col-app { grid-column:1; }

/* COL 1 — PROSE. 560px is 36 CJK characters at the apparent size size-adjust
   produces, which is the driving constraint: the narration is Chinese. */
.ev.assistant .body { font-size:var(--t-read); line-height:1.68; white-space:pre-wrap;
  overflow-wrap:anywhere; }
/* the paragraph gap has to beat the line gap or paragraphs stop being paragraphs:
   16.5 × 1.68 is 27.7px of leading, so 32 is the smallest step on the scale that works */
.ev.assistant + .ev.assistant { margin-top:var(--s5); }
.ev.assistant code { font-family:var(--mono); font-size:var(--t-note); color:var(--muted);
  margin:0 .08em; }
.ev.assistant b { font-weight:600; }
.ev.assistant i { font-style:italic; }
.ev.user { margin:var(--s4) 0 var(--s4) 24px; border-left:2px solid var(--accent);
  padding-left:var(--s3); }
.ev.user .body { font-size:var(--t-read); line-height:1.68; white-space:pre-wrap;
  overflow-wrap:anywhere; }
.ev.enter { animation:ev-in 140ms linear 1; }

/* COL 2 — APPARATUS. Everything the machine DID rather than SAID. The timestamp
   sits at the column's own left edge, not in a left gutter: moving timestamps out
   of a left gutter is the single fastest way to stop looking like a log viewer. */
.col-app .ev { font-family:var(--mono); font-size:var(--t-note); line-height:1.45;
  color:var(--muted); display:flex; align-items:baseline; }
.col-app .ev + .ev { margin-top:3px; }
.ev .ts { color:var(--faint); display:inline-block; width:40px; flex:none;
  font-variant-numeric:tabular-nums; }
.ev.tool .body, .ev.system .body { display:block; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; }
/* The tool NAME repeats twelve times in a row; the argument is what varies, so the
   argument gets the ink and the name recedes. Emphasising the repeated word is
   what turns a column of facts into a wall of text. */
.ev.tool .tname { color:var(--faint); }
.ev.tool .targ { color:var(--muted); }
.ev.system .body { color:var(--faint); }
.ev.turn { margin:var(--s3) 0 var(--s2); padding-top:6px; border-top:1px solid var(--hair);
  color:var(--faint); }
/* IMPORTANCE IS ENCODED AS WIDTH: an ordinary tool line is 240px; a failure is
   allowed to break the column discipline and take the whole 848. */
.ev.error { font-family:var(--sans); font-size:var(--t-read); line-height:1.55;
  color:var(--bad); border-left:2px solid var(--bad); padding:0 0 0 var(--s3);
  white-space:pre-wrap; overflow-wrap:anywhere; }
.stream-empty { color:var(--faint); font-size:var(--t-read); }

/* ── COL 3 — THE SHELF. Only things that CHANGE. ──────────────────────────── */
.shelf-card { display:block; width:100%; text-align:left; font:inherit; color:inherit;
  background:none; border:0; padding:0; cursor:pointer; }
.shelf-card > span { display:block; }
.shelf-thumb { width:100%; height:170px; border-radius:var(--r-lift); overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  background-color:var(--raise);
  background-image:linear-gradient(45deg,rgb(var(--ink-rgb)/.035) 25%,transparent 25%),
    linear-gradient(-45deg,rgb(var(--ink-rgb)/.035) 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,rgb(var(--ink-rgb)/.035) 75%),
    linear-gradient(-45deg,transparent 75%,rgb(var(--ink-rgb)/.035) 75%);
  background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0; }
.shelf-thumb img { max-width:100%; max-height:100%; display:block; }
.shelf-t { font-size:var(--t-lead); font-weight:500; line-height:1.36; letter-spacing:-.005em;
  margin-top:var(--s3); }
.shelf-f { font-family:var(--mono); font-size:var(--t-note); color:var(--muted); margin-top:var(--s1);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.shelf-badge { margin-top:var(--s2); }
.shelf-list { margin-top:var(--s5); }
.shelf-list h3 { font-size:var(--t-ui); color:var(--muted); margin-bottom:var(--s3); }
.shelf-row { display:flex; align-items:baseline; gap:var(--s2); font-family:var(--mono);
  font-size:var(--t-note); color:var(--muted); padding:var(--s1) 0; width:100%; text-align:left;
  background:none; border:0; cursor:pointer; border-radius:var(--r-mark); }
.shelf-row span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.shelf-row .sz { margin-left:auto; color:var(--faint); flex:none; }
.shelf-row.lead { color:var(--ink); }
.shelf-row:hover { color:var(--ink); }
.shelf-spark { font-size:var(--t-read); line-height:1.6; color:var(--muted);
  display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden; }
.shelf-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:var(--s4); }

/* ── STAGE NAV — full-bleed, labeled, clickable. Stage shows as magnitude (the
   folio) and, here, as a strip you move along: click one to open its log. ───── */
.footrule { flex:none; padding:7px var(--gutter) 9px;
  border-top:1px solid rgb(var(--ink-rgb)/.10); }
.stagenav { display:flex; gap:3px; }
.snav { flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center;
  gap:6px; padding:5px 4px 3px; background:none; border:0; border-radius:var(--r-mark);
  cursor:pointer; font:inherit; transition:background-color 120ms linear; }
.snav:hover { background:rgb(var(--ink-rgb)/.06); }
.snav:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.snav .bar { width:100%; height:3px; border-radius:2px; background:rgb(var(--ink-rgb)/.14);
  transition:background-color 200ms linear, height 180ms cubic-bezier(.2,.7,.3,1); }
.snav .lbl { font-family:var(--mono); font-size:10.5px; letter-spacing:.02em;
  color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:100%; transition:color 150ms linear; }
.snav:hover .lbl { color:var(--ink); }
/* completed work must LOOK completed: a confident ink bar, not the pending
   whisper. .42 read as grey on the dark sheet — this is legible in both themes. */
.snav.done .bar { background:rgb(var(--ink-rgb)/.72); }
.snav.done .lbl { color:var(--muted); }
.snav.cur .bar { height:5px; background:var(--state); }
.snav.cur .lbl { color:var(--ink); font-weight:600; }
.snav.wait .bar { background:var(--wait); }
.snav.wait .lbl { color:var(--ink); font-weight:600; }
.snav.err .bar { background:var(--bad); }
/* the most-recent / final stage — accent. A finished run has no live 'current'
   stage (every bar is done), so this marks where the work ended. Placed after
   .done so it wins the equal-specificity tie for the final bar's colour. */
.snav.last .bar { height:5px; background:var(--accent); }
.snav.last .lbl { color:var(--ink); font-weight:600; }

/* ── REPLY LINE — 44px at rest, no field, no button, no dead input ─────────── */
.replyline { flex:none; height:44px; padding:0 var(--gutter);
  display:flex; align-items:center;
  transition:height 260ms cubic-bezier(.2,.7,.3,1); }
.reply-hint { font-size:var(--t-ui); color:var(--muted); }
.asking .replyline { height:236px; align-items:stretch; background:var(--sheet);
  box-shadow:var(--lift-sheet); border-top:2px solid var(--wait); }
/* the one accent-filled control while asking wears the WAIT colour, not the
   RUNNING colour: a terracotta button in a violet moment says the wrong word */
.asking .btn.go { background:var(--wait); border-color:var(--wait); }
.asking .btn.go:hover:not(:disabled) { background:color-mix(in oklab,var(--wait) 86%,var(--ink)); }
.asking .sheet-scroll { opacity:.55; }
.sheet-scroll { transition:opacity 260ms linear; }
.reply-form { display:none; width:100%; max-width:560px; padding-top:var(--s4); }
.asking .reply-form { display:block; }
.asking .reply-hint { display:none; }
#reply { display:block; width:100%; font:inherit; font-size:var(--t-read); line-height:1.55;
  color:var(--ink); background:transparent; border:0; border-bottom:2px solid var(--wait);
  border-radius:0; padding:0 0 var(--s2); resize:none; height:84px; }
#reply::placeholder { color:var(--faint); }
#reply:focus-visible { box-shadow:none; outline:none; border-bottom-color:var(--wait); }
.reply-foot { display:flex; align-items:center; gap:var(--s4); margin-top:var(--s3); }
.reply-note { font-size:var(--t-ui); color:var(--muted); }
.reply-note.err { color:var(--bad); }
.conn { position:fixed; left:var(--gutter); bottom:var(--s2); font-family:var(--mono);
  font-size:var(--t-note); color:var(--stale); animation:ev-in 140ms linear 1; }

/* ═══ STATE LANGUAGE ════════════════════════════════════════════════════════
   Shape as well as colour, so a state survives colour-blindness and a three-metre
   glance at the same time. It appears in exactly three places: beside the status
   sentence, in the head-strip chip, and per row in the run switcher. */
.dot { width:8px; height:8px; flex:none; border-radius:1px; background:var(--graphite);
  display:block; }
.dot.running, .dot.starting { width:3px; height:10px; background:var(--accent); }
.dot.waiting { background:var(--wait); transform:rotate(45deg); }
.dot.done { background:transparent; border:1.5px solid var(--ok); }
.dot.error { background:var(--bad); border-radius:0; clip-path:polygon(50% 0,100% 100%,0 100%); }
.dot.stopped { width:8px; height:2px; background:var(--graphite); }
.dot.big { width:12px; height:12px; }
.dot.big.running, .dot.big.starting { width:4px; height:15px; }
.dot.big.done { border-width:2px; }
.dot.big.stopped { width:12px; height:3px; }

/* ═══ CONTROLS — three heights: 28 (ghost/icon), 36 (everything), 48 (commit) ══ */
.btn { font:inherit; font-size:var(--t-ui); font-weight:450; cursor:pointer; color:var(--ink);
  background:transparent; border:1px solid rgb(var(--ink-rgb)/.20); border-radius:var(--r-lift);
  padding:0 var(--s3); height:36px; white-space:nowrap; display:inline-flex; align-items:center;
  gap:7px; text-decoration:none;
  transition:background-color 120ms cubic-bezier(.2,0,.38,.9),
             border-color 120ms cubic-bezier(.2,0,.38,.9),
             color 120ms cubic-bezier(.2,0,.38,.9); }
.btn:hover:not(:disabled) { background:rgb(var(--ink-rgb)/.06); border-color:rgb(var(--ink-rgb)/.34); }
.btn:disabled { opacity:.38; cursor:default; }
.btn .i { color:var(--faint); }
.btn:hover:not(:disabled) .i { color:var(--ink); }
/* head-strip controls are ghosts: no border, no fill, until you reach for them */
.btn.sm { height:28px; padding:0 var(--s3); color:var(--muted); border-color:transparent; }
.btn.sm:hover:not(:disabled) { color:var(--ink); border-color:transparent;
  background:rgb(var(--ink-rgb)/.07); }
/* ONE accent-filled control per view, and the run view has none: while you are
   watching there is no primary action. */
.btn.go { height:48px; padding:0 var(--s4); font-size:var(--t-ui); font-weight:600;
  background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.btn.go:hover:not(:disabled) { background:color-mix(in oklab,var(--accent) 86%,var(--ink));
  border-color:transparent; }
.btn.danger:hover:not(:disabled) { color:var(--bad);
  border-color:color-mix(in oklab,var(--bad) 46%,transparent); }
.iconbtn { font:inherit; cursor:pointer; color:var(--muted); background:transparent;
  border:1px solid transparent; border-radius:var(--r-lift); width:34px; height:34px; padding:0;
  display:flex; align-items:center; justify-content:center;
  transition:background-color 120ms cubic-bezier(.2,0,.38,.9), color 120ms cubic-bezier(.2,0,.38,.9); }
.iconbtn:hover { background:rgb(var(--ink-rgb)/.08); color:var(--ink); }
.iconbtn:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
/* the ledger toggle: an "i" in a ring reads as "info about this run", where a
   bare italic i read as a typo. */
.iconbtn b { font-family:var(--mono); font-size:12px; font-weight:600; line-height:1;
  width:18px; height:18px; border-radius:50%; border:1.5px solid currentColor;
  display:flex; align-items:center; justify-content:center; }
.themebtn svg { display:none; }
.themebtn[data-theme="system"] .i-sys,
.themebtn[data-theme="light"]  .i-sun,
.themebtn[data-theme="dark"]   .i-moon { display:block; }
/* the language switch: a compact 中 / EN toggle. The active side is inked, the
   other faint, so the control reads as a state, not a menu. */
.langbtn { width:auto; padding:0 var(--s2); gap:3px; font-family:var(--mono);
  font-size:var(--t-note); line-height:1; }
.langbtn .lg-seg { color:var(--faint); font-weight:400;
  transition:color 120ms cubic-bezier(.2,0,.38,.9); }
.langbtn .lg-sep { color:rgb(var(--ink-rgb)/.28); }
.langbtn[data-lang="zh"] .lg-zh,
.langbtn[data-lang="en"] .lg-en { color:var(--ink); font-weight:600; }
.langbtn:hover .lg-seg { color:var(--muted); }
.langbtn:hover[data-lang="zh"] .lg-zh,
.langbtn:hover[data-lang="en"] .lg-en { color:var(--ink); }
.i { width:18px; height:18px; flex:none; display:block; }
.i.sm { width:13px; height:13px; }

.chip { display:inline-flex; align-items:center; font-family:var(--mono); font-size:var(--t-note);
  border-radius:var(--r-mark); padding:var(--s1) var(--s2); white-space:nowrap; color:var(--muted);
  background:rgb(var(--ink-rgb)/.06); }
.chip.ok  { color:var(--ok);   background:color-mix(in oklab,var(--ok) 14%,transparent); }
.chip.bad { color:var(--bad);  background:color-mix(in oklab,var(--bad) 14%,transparent); }
.chip.warn{ color:var(--wait); background:color-mix(in oklab,var(--wait) 16%,transparent); }
.chip.acc { color:var(--accent);background:color-mix(in oklab,var(--accent) 14%,transparent); }
.linkish { font:inherit; font-size:var(--t-ui); background:none; border:0; padding:0;
  cursor:pointer; color:var(--muted); text-decoration:underline; text-underline-offset:3px; }
.linkish:hover { color:var(--ink); }

/* fields are manuscript lines, not boxes */
.msline { display:block; width:100%; font:inherit; font-size:var(--t-read); line-height:1.68;
  color:var(--ink); background:transparent; border:0; border-bottom:1px solid rgb(var(--ink-rgb)/.24);
  border-radius:0; padding:0 0 var(--s2); resize:none;
  transition:border-color 120ms cubic-bezier(.2,0,.38,.9); }
.msline::placeholder { color:var(--faint); }
.msline:hover { border-bottom-color:rgb(var(--ink-rgb)/.40); }
.msline:focus { outline:none; border-bottom:2px solid var(--accent); padding-bottom:calc(var(--s2) - 1px); }
.msline:focus-visible { box-shadow:none; }
/* :not(.msline) is load-bearing — an attribute selector outranks a class, so the
   plain rule would turn every manuscript line back into a box. */
select, input[type=text]:not(.msline), input[type=password]:not(.msline) {
  font:inherit; font-size:var(--t-ui); width:100%;
  color:var(--ink); background:var(--sheet); border:1px solid rgb(var(--ink-rgb)/.22);
  border-radius:var(--r-mark); padding:0 var(--s3); height:36px; }

/* ═══ POPOVERS — one raised recipe, radius 10, --lift-pop, nothing else casts ══ */
.scrim { position:fixed; inset:0; background:var(--scrim); z-index:40; }
.pop { position:fixed; z-index:41; background:var(--raise); border-radius:var(--r-lift);
  box-shadow:var(--lift-pop); animation:ask-rise 200ms cubic-bezier(.2,.7,.3,1) 1; }
.pop-head { display:flex; align-items:center; gap:var(--s3); padding:var(--s4) var(--s4) var(--s3); }
.pop-head h2 { font-size:var(--t-lead); font-weight:500; letter-spacing:-.005em; }
.pop-head .iconbtn { margin-left:auto; }
.pop-body { padding:0 var(--s4) var(--s4); overflow-y:auto; }

/* ── THE REPORT VIEW — report.html shown in-app, full-bleed. Above the run and
   the pops (z 45); it is opaque, so it needs no scrim. A slim bar carries Back /
   title / close, and the iframe takes every remaining pixel — a dashboard wants
   width, so it gets the whole window, not the prose column. ─────────────────── */
.report-view { position:fixed; inset:0; z-index:45; background:var(--sheet);
  display:flex; flex-direction:column;
  animation:ask-rise 200ms cubic-bezier(.2,.7,.3,1) 1; }
.report-bar { flex:none; height:44px; display:flex; align-items:center; gap:var(--s4);
  padding:0 var(--gutter); border-bottom:1px solid var(--hair); }
.report-bar .iconbtn { margin-left:auto; }
.report-title { font-family:var(--mono); font-size:var(--t-note); letter-spacing:.06em;
  text-transform:uppercase; color:var(--muted); }
.report-frame { flex:1; min-height:0; width:100%; border:0; background:var(--sheet); }

/* the ledger sheet — 440x520, three tiers with real typographic separation */
.ledger { width:440px; height:min(560px, calc(100vh - 96px)); left:50%; top:50%;
  transform:translate(-50%,-50%); display:flex; flex-direction:column; }
/* a six-line plugin stack trace would push the tiers off the sheet */
.lrow .lg { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical;
  overflow:hidden; }
.ledger .pop-body { flex:1; min-height:0; }
.lrow { padding:var(--s2) 0; border-bottom:1px solid var(--hair); }
.lrow:last-child { border-bottom:0; }
.lrow .lk { display:flex; align-items:baseline; gap:var(--s3); }
.lrow .lk span { font-size:var(--t-ui); color:var(--muted); }
.lrow .lk b { margin-left:auto; font-family:var(--mono); font-size:var(--t-note); font-weight:500;
  text-align:right; overflow-wrap:anywhere; }
/* every hover tooltip printed as a visible line: the audience is academics on
   Windows, not developers — nobody discovers a hover on a value they cannot name */
.lrow .lg { font-size:var(--t-note); color:var(--faint); line-height:1.45; margin-top:2px;
  max-width:34em; }
.ltier { margin-top:var(--s4); }
.ltier h3 { font-size:var(--t-ui); color:var(--muted); margin-bottom:var(--s2); }
.ledger .tier-live .lk b { color:var(--ink); }
.ledger .tier-per  .lk b { color:var(--muted); }
.ledger .tier-fix  .lk b { color:var(--faint); }
.lmodels { margin-top:var(--s3); }
.lmodels .lrow .lk b { font-size:var(--t-note); }

/* the run switcher — 380px, and it is also where `New paper` lives */
.switcher { width:380px; max-height:min(70vh,560px); left:var(--gutter); top:52px;
  display:flex; flex-direction:column; }
.sw-list { overflow-y:auto; padding:var(--s3) var(--s3) 0; }
.sw-row { display:block; width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer;
  background:none; border:0; border-radius:var(--r-mark); padding:var(--s3); min-height:44px;
  transition:background-color 120ms cubic-bezier(.2,0,.38,.9); }
.sw-row:hover { background:rgb(var(--ink-rgb)/.06); }
.sw-row.sel { background:rgb(var(--ink-rgb)/.08); }
.sw-top { display:flex; align-items:center; gap:var(--s3); }
.sw-t { font-size:var(--t-lead); font-weight:500; line-height:1.30; letter-spacing:-.005em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.sw-sub { font-family:var(--mono); font-size:var(--t-note); color:var(--muted); margin-top:var(--s1);
  padding-left:20px; }
.sw-sub.needs { color:var(--wait); }
.sw-foot { padding:var(--s3); }
.sw-empty { padding:var(--s4) var(--s3); }
.sw-empty .h { font-size:var(--t-lead); font-weight:500; }
.sw-empty .p { font-size:var(--t-ui); color:var(--muted); margin-top:var(--s2); line-height:1.5; }

/* the chip popover on the start view: it contains the untouched original <select> */
.cpop { width:300px; padding:var(--s4); }
.cpop .hint { font-size:var(--t-note); color:var(--faint); line-height:1.5; margin-top:var(--s2); }
.cpop .hint .mono { font-family:var(--mono); }

/* ═══ THE START VIEW — the page IS the input ════════════════════════════════ */
.col { padding:var(--s8) var(--gutter) var(--s7); max-width:calc(640px + 2 * var(--gutter));
  width:100%; }
.col.wide { max-width:calc(720px + 2 * var(--gutter)); }
/* The start and settings views get the same sheet the run view has: the desk is
   what the instrument rules sit on, the sheet is what the app is written on, and a
   white input floating on bare desk reads as unfinished. */
.viewscroll { flex:1; min-height:0; overflow-y:auto; background:var(--sheet);
  box-shadow:var(--lift-sheet); }
.vhead { font-size:var(--t-display); font-family:var(--sans-dp); font-weight:450; line-height:1.30;
  letter-spacing:-.015em; }
.field { margin-top:var(--s6); }
/* 34vh of empty writing area put the placeholder 340px from its own rule, which
   reads as a hole rather than as a page. 26vh keeps the invitation and loses it. */
#f-spark { min-height:clamp(200px,26vh,300px); }
.field .hint { font-size:var(--t-note); color:var(--faint); margin-top:var(--s2); line-height:1.5; }
.chipline { margin-top:var(--s6); display:flex; align-items:center; flex-wrap:wrap; gap:2px;
  font-size:var(--t-ui); }
.cchip { font:inherit; font-size:var(--t-ui); background:none; border:0; cursor:pointer;
  color:var(--ink); padding:var(--s1) var(--s2); border-radius:var(--r-mark); border-bottom:1px dashed rgb(var(--ink-rgb)/.30);
  transition:background-color 120ms cubic-bezier(.2,0,.38,.9); }
.cchip:hover { background:rgb(var(--ink-rgb)/.06); }
.chipline .dot-sep { color:var(--faint); padding:0 var(--s1); }
.go-row { margin-top:var(--s6); display:flex; align-items:center; gap:var(--s4); flex-wrap:wrap; }
.go-note { font-size:var(--t-read); line-height:1.5; max-width:26em; }
.form-err { color:var(--bad); font-size:var(--t-read); margin-top:var(--s4); }
.missing { border-left:2px solid var(--bad); padding:var(--s2) 0 var(--s2) var(--s3);
  color:var(--bad); font-size:var(--t-read); line-height:1.5; margin-bottom:var(--s5); }
.missing b { display:block; font-weight:600; }

/* the legend-row device survives, and appears at most twice in the product:
   settings group heads and artifact-tree heads. Zero times in the run view. */
.legend { font-size:var(--t-ui); font-weight:450; color:var(--muted); white-space:nowrap; }
.legend-row { display:flex; align-items:center; gap:var(--s3); }
.legend-row .rule { flex:1; height:1px; background:var(--hair); display:block; }

/* ═══ FIGURE WORKBENCH — no standfirst, no foot rule, no apparatus, no shelf.
   The workbench wants width, and here it finally gets the full 1160 band. ════ */
.wpad { padding:var(--s5) var(--gutter) var(--s7); }
.strip-index { display:flex; gap:var(--s3); overflow-x:auto; padding-bottom:var(--s3);
  margin-bottom:var(--s5); }
.fthumb { flex:none; width:152px; background:none; border:0; padding:0; cursor:pointer;
  font:inherit; color:inherit; text-align:left; border-radius:var(--r-lift); }
.fthumb .box { position:relative; height:86px; border-radius:var(--r-lift); overflow:hidden;
  display:flex; align-items:center; justify-content:center; background:var(--raise);
  transition:box-shadow 120ms cubic-bezier(.2,0,.38,.9); }
.fthumb img { max-width:100%; max-height:100%; display:block; }
.fthumb.sel .box { box-shadow:0 0 0 2px var(--ink); }
/* the paper's figure number, printed on the thumbnail so the strip is navigable
   by "Figure 3" rather than the codename below. Neutral solid, not accent —
   seven of these are on screen at once, and accent is the state colour. */
.fnum { position:absolute; top:5px; left:5px; z-index:1; font-family:var(--mono);
  font-size:var(--t-fine); font-weight:600; line-height:1; letter-spacing:.02em;
  padding:2px 5px; border-radius:var(--r-mark);
  background:rgb(var(--ink-rgb)/.82); color:var(--sheet); }
.fnum.none { background:rgb(var(--ink-rgb)/.34); }
.fthumb .cap { font-family:var(--mono); font-size:var(--t-note); color:var(--muted);
  margin-top:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fthumb.sel .cap { color:var(--ink); }
/* the detail head now answers "which figure, and what does it show" first: a
   full-width title line (Figure N — caption), then a quiet secondary row for the
   codename, engine/audit chips, iteration rounds and the /Font /Image badge. */
.fig-head { display:block; }
.fig-title { font-size:var(--t-lead); font-weight:500; letter-spacing:-.005em;
  line-height:1.3; max-width:52em; color:var(--ink); }
.fig-n { font-weight:600; color:var(--ink); }
.fig-n.none { font-weight:500; color:var(--muted); }
.fig-dash { color:var(--faint); }
.fig-cap { color:var(--ink); }
.fig-sub { display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap;
  margin-top:var(--s3); }
.fig-code { font-family:var(--mono); font-size:var(--t-note); color:var(--faint);
  padding:var(--s1) var(--s2); border:1px solid var(--hair); border-radius:var(--r-mark); }
.fig-note { font-size:var(--t-read); margin:var(--s3) 0 var(--s4); max-width:60em; line-height:1.55;
  color:var(--muted); }
.fig-note.bad { color:var(--bad); }
.fig-bar { display:flex; align-items:center; gap:var(--s1); flex-wrap:wrap; margin-bottom:var(--s4); }
.fig-bar .sep { color:var(--faint); font-size:var(--t-ui); margin:0 var(--s2) 0 var(--s3); }
/* the mono contract forbids mono on a button; these are file stems, but `fit` and
   the steppers are not, so the row goes to sans and the numeral stays mono */
.vbtn { font:inherit; font-size:var(--t-ui); cursor:pointer;
  background:transparent; color:var(--muted); border:1px solid rgb(var(--ink-rgb)/.18);
  border-radius:var(--r-mark); padding:0 var(--s3); height:28px;
  transition:background-color 120ms cubic-bezier(.2,0,.38,.9), color 120ms cubic-bezier(.2,0,.38,.9); }
.vbtn:hover { background:rgb(var(--ink-rgb)/.07); color:var(--ink); }
.vbtn.sel { background:rgb(var(--ink-rgb)/.10); color:var(--ink); }
.stepper { display:inline-flex; align-items:center; gap:var(--s1); }
.zoomval { font-family:var(--mono); font-size:var(--t-note); color:var(--muted); min-width:46px;
  text-align:center; }
.fig-panes { display:grid; grid-template-columns:minmax(0,560px) minmax(0,560px); gap:40px;
  justify-content:start; }
@media (max-width:1200px) { .fig-panes { grid-template-columns:minmax(0,1fr); } }
.fig-panes figure { margin:0; min-width:0; }
/* the checkerboard is functional: it is how you tell a white-background PNG from
   a transparent SVG */
.fig-panes figcaption { font-family:var(--mono); font-size:var(--t-note); color:var(--muted);
  margin-bottom:var(--s2); }
.zoombox { height:auto; min-height:200px; max-height:min(58vh,560px);
  overflow:auto; border-radius:var(--r-lift);
  background-color:var(--raise);
  background-image:linear-gradient(45deg,rgb(var(--ink-rgb)/.035) 25%,transparent 25%),
    linear-gradient(-45deg,rgb(var(--ink-rgb)/.035) 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,rgb(var(--ink-rgb)/.035) 75%),
    linear-gradient(-45deg,transparent 75%,rgb(var(--ink-rgb)/.035) 75%);
  background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0; }
.zoombox img { display:block; width:100%; height:auto; }
.zoombox .none { color:var(--faint); font-size:var(--t-ui); padding:var(--s4); text-align:center; }
.vbadge { display:inline-flex; margin-left:auto; border-radius:var(--r-mark); overflow:hidden;
  font-family:var(--mono); font-size:var(--t-fine); font-weight:500; letter-spacing:.08em; }
.shelf-badge .vbadge { margin-left:0; }
.vseg { padding:var(--s1) var(--s2); display:flex; align-items:center; gap:5px; }
.vseg .i { width:11px; height:11px; }
.vseg.ok { background:color-mix(in oklab,var(--ok) 14%,transparent); color:var(--ok); }
/* the ONLY solid saturated fill in the entire product — one thing is allowed to
   shout, and it is the thing that ruins a submission */
.vseg.bad { background:var(--bad); color:#fff; }
.vseg.na { background:rgb(var(--ink-rgb)/.06); color:var(--faint); }
.pane-note { color:var(--faint); font-size:var(--t-read); padding:var(--s4) 0; }

/* ═══ FILES — 240px index, 48px of air, an 872px reader ═════════════════════ */
.browser { display:grid; grid-template-columns:240px minmax(0,872px); column-gap:var(--s6);
  justify-content:start; align-items:start; }
.tree-group { margin-bottom:var(--s4); }
.tfile { display:flex; align-items:baseline; gap:var(--s2); width:100%; text-align:left; font:inherit;
  cursor:pointer; background:none; border:0; border-radius:var(--r-mark); padding:var(--s1) var(--s2);
  color:var(--muted); font-family:var(--mono); font-size:var(--t-note); overflow:hidden;
  transition:background-color 120ms cubic-bezier(.2,0,.38,.9); }
.tfile > :first-child { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.tfile:hover { background:rgb(var(--ink-rgb)/.06); color:var(--ink); }
.tfile.sel { background:rgb(var(--ink-rgb)/.09); color:var(--ink); }
.tfile .sz { color:var(--faint); margin-left:auto; white-space:nowrap; flex:none; }
.pv-head { display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; margin-bottom:var(--s3); }
.pv-path { font-family:var(--mono); font-size:var(--t-note); overflow-wrap:anywhere; color:var(--muted); }
/* --raise and --sheet are 4/255 apart, so this is exactly the case the hairline
   rule permits: two surfaces of equal value, therefore a line. */
.pv-body { border:1px solid var(--hair); border-radius:var(--r-lift); background:var(--raise);
  overflow:hidden; }
.pv-body iframe { display:block; width:100%; height:66vh; border:0; background:var(--raise); }
.pv-body img { display:block; max-width:100%; }
.pv-body pre { margin:0; padding:var(--s4); max-height:66vh; overflow:auto; font-family:var(--mono);
  font-size:var(--t-note); line-height:1.6; white-space:pre; }

/* ═══ SETTINGS — one 640px column, no standfirst, no foot rule ══════════════ */
.gcard { margin-top:var(--s6); }
.gcard h2 { font-size:var(--t-lead); font-weight:500; letter-spacing:-.005em; }
.gcard .why { font-size:var(--t-read); color:var(--muted); margin-top:var(--s2); line-height:1.55; }
.var { display:grid; grid-template-columns:200px minmax(0,1fr); gap:var(--s3); align-items:center;
  padding:var(--s2) 0; border-bottom:1px solid var(--hair); }
.var:last-of-type { border-bottom:0; }
.var .vname { font-family:var(--mono); font-size:var(--t-note); color:var(--muted);
  overflow-wrap:anywhere; }
.varlist { margin-top:var(--s4); }
.gfoot { display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; margin-top:var(--s4); }
.light { width:8px; height:8px; border-radius:1px; background:var(--graphite); flex:none; }
.light.ok { background:var(--ok); }
.light.bad { background:var(--bad); }
.light.busy { background:var(--accent); }
.gnote { font-size:var(--t-ui); color:var(--muted); overflow-wrap:anywhere; }
.gnote.ok { color:var(--ok); }
.gnote.bad { color:var(--bad); }
.envpath { font-family:var(--mono); font-size:var(--t-note); color:var(--faint);
  margin-top:var(--s5); overflow-wrap:anywhere; }

/* ═══ THE CEREMONY — one shot, 420ms, flag-guarded by run id ════════════════ */
.arrive .rule-state { animation:arrive-rule 260ms cubic-bezier(.2,.7,.3,1) 1; }
.arrive .tick { animation:arrive-tick 108ms linear both; animation-delay:calc(var(--i) * 12ms); }
.arrive .standfirst { animation:ev-in 220ms linear 1; }

/* ═══ BREAKPOINTS, derived from content ════════════════════════════════════
   The sheet needs 2*64 + 560 + 48 + 240 + 48 + 264 = 1288. */
#log-toggle { display:none; }
@media (max-width:1287px) {
  .sheet-body { grid-template-columns:minmax(0,848px); }
  .shelf { display:none; }
}
@media (max-width:1139px) {
  #log-toggle { display:inline-flex; margin-bottom:var(--s4); }
  .trow, .trow.wide { grid-template-columns:minmax(0,560px); }
  .col-app { display:none; }
  .app-open .col-app { display:block; grid-column:1; margin-top:var(--s3); }
}
@media (max-height:899px) {
  .standfirst { padding-top:24px; padding-bottom:16px; }
  .sb-line, #r-question { font-size:28px; }
  .folio { font-size:38px; }
}
@media (max-width:779px) { .ticks { display:none; } }
@media (max-width:860px) {
  .browser { grid-template-columns:minmax(0,1fr); row-gap:var(--s4); }
  .nav { display:none; }
}

/* ── odds and ends that belong to no region ───────────────────────────────── */
.wpad-in { padding-top:var(--s5); }
#runview[data-pane="figures"] .standfirst,
#runview[data-pane="tree"]    .standfirst { display:none; }
/* the stage nav is navigation now, not decoration — keep it on every pane */
.disclose .tri { transition:transform 120ms; }
.disclose.closed .tri { transform:rotate(-90deg); }
/* microTape survives as the run-switcher row mark */
.mtape { display:flex; gap:2px; width:72px; flex:none; }
.mtape i { flex:1; height:3px; border-radius:1px; background:rgb(var(--ink-rgb)/.14); }
.mtape i.done { background:rgb(var(--ink-rgb)/.34); }
.mtape i.cur  { background:var(--accent); }
.mtape i.wait { background:var(--wait); }
.mtape i.ok   { background:var(--ok); }
.mtape i.err  { background:var(--bad); }

/* ── tiny helpers ───────────────────────────────────────────────────────── */
var $ = function (sel, root) { return (root || document).querySelector(sel); };
var ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
function esc(s) {
  return String(s === null || s === undefined ? "" : s)

function clock(ms) {
  if (!ms) return "";
  var d = new Date(ms);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
/* started arrives as epoch seconds, epoch ms, or an ISO string — accept all three. */
function toMs(v) {
  if (v === null || v === undefined || v === "") return null;
  if (typeof v === "number") return v > 1e11 ? v : v * 1000;
  var n = Date.parse(v);
  return isNaN(n) ? null : n;
}
/* At --t-data the clock is 21px mono beside a 21px cost, so it is compact and
   tabular: 62m, 1h02. A reflowing clock at that size is visible from across the
   room, which is why every numeral here is tabular. */
function compact(sec) {
  var s = Math.max(0, Math.round(sec)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? h + "h" + String(m).padStart(2, "0") : m + "m";
}
function elapsed(startMs, endMs) {
  if (!startMs) return "—";
  return compact(((endMs || Date.now()) - startMs) / 1000);
}
/* A finished run's clock has to stop; left live it counts up for days. For a
   finished run the CLI's own duration is the authority — a workdir adopted from
   an earlier server can carry a "started" stamp later than its last output, and
   guessing from two clocks that disagree is how you print a confident 0 m. */
function runElapsed() {
  var live = !S.run || !TERMINAL[S.run.status];
  var start = toMs(meta(S.runId).started);
  if (live) return elapsed(start);
  var ms = (S.run.telemetry || {}).duration_ms;
  if (ms) return compact(ms / 1000);
  if (start && S.lastT > start) return elapsed(start, S.lastT);
  return "—";
}
function elShort(startMs) {
  if (!startMs) return "";

function ago(ms) {
  var s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 45) return s + " s";
  var m = Math.round(s / 60);

  return Math.floor(m / 60) + " h " + (m % 60) + " m";

/* Compact but never lossy where it matters: a five-figure token count reads as

function tokfmt(n) {
  if (n === null || n === undefined) return "—";
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e4) return (n / 1e3).toFixed(1) + "k";
  return n.toLocaleString("en-US");
}
function big(n) {
  if (n === null || n === undefined) return "—";
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + "M";
  if (n >= 1e3) return Math.round(n / 1e3) + "k";

  return (v === null || v === undefined) ? "—" : "$" + Number(v).toFixed(2);
}
function bytes(n) {
  n = Number(n) || 0;
  if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";

var LANGS = ["zh", "en"];
function readLang() {
  var q = /[?&]lang=(zh|en)\b/.exec(location.search);
  if (q) return q[1];
  try { var v = localStorage.getItem("cockpit-lang");
        return LANGS.indexOf(v) >= 0 ? v : "zh"; } catch (e) { return "zh"; }
}
var LANG = readLang();
function t(key) {
  var d = I18N[LANG] || I18N.zh;
  var v = d[key];
  if (v === undefined) v = (I18N.en[key] !== undefined ? I18N.en[key] : key);
  return v;
}
/* A server status word ("running", "done", …) shown as a chip. Unknown values
   pass through untranslated rather than showing a raw i18n key. */
function statusLabel(s) {
  var d = I18N[LANG] || I18N.zh;
  var v = d["status." + s];
  return v === undefined ? String(s || "") : v;
}
function applyLang(l) {
  LANG = (LANGS.indexOf(l) >= 0 ? l : "zh");
  document.documentElement.lang = (LANG === "zh" ? "zh-Hans" : "en");
  var b = $("#btn-lang");
  if (b) b.dataset.lang = LANG;
}
/* Static chrome that no view function rebuilds — set it directly by id. */
function applyStaticI18n() {
  function txt(sel, v) { var e = $(sel); if (e) e.textContent = v; }
  function tip(sel, v) { var e = $(sel); if (e) e.title = v; }
  txt('#r-tabs .tab[data-pane="stream"]', t("nav.progress"));
  txt('#r-tabs .tab[data-pane="figures"]', t("nav.figures"));
  txt('#r-tabs .tab[data-pane="tree"]', t("nav.files"));
  txt("#r-pdf", t("btn.openPdf"));
  txt("#r-stop", t("btn.stop"));
  txt("#new-label", t("btn.newPaper"));
  txt("#report-back-label", t("report.back"));
  txt("#set-back-label", t("set.back"));   /* settings back button, when present */
  txt("#report-title-lbl", t("report.title"));
  txt("#conn", t("conn.reconnecting"));
  /* the ledger sheet headings */
  var lh = $("#ledger .pop-head h2"); if (lh) lh.textContent = t("ledger.title");
  var h3s = document.querySelectorAll("#ledger .ltier h3");
  if (h3s[0]) h3s[0].textContent = t("ledger.perTurn");
  if (h3s[1]) h3s[1].textContent = t("ledger.fixed");
  if (h3s[2]) h3s[2].textContent = t("ledger.env");
  tip("#btn-ledger", t("tip.ledger"));
  tip("#btn-settings", t("tip.settings"));
  /* the Report button keeps its label only when visible; set it regardless */
  var rep = $("#r-report"); if (rep) rep.textContent = t("btn.report");
}
/* Re-render everything the language touches, in place, no reload. */
function rerenderChrome() {
  applyStaticI18n();
  if (S.view === "settings") { if (S.settings) renderSettings(); else loadSettings(true); }
  else if (S.view === "new") showNew();
  else if (S.view === "run" && S.runId) openRun(S.runId);
}
function initLang() {
  applyLang(readLang());
  applyStaticI18n();
  var b = $("#btn-lang");
  if (b) b.addEventListener("click", function () {
    var next = LANG === "zh" ? "en" : "zh";
    try { localStorage.setItem("cockpit-lang", next); } catch (e) { /* private mode */ }
    applyLang(next);
    rerenderChrome();
  });
}

function meta(id) {
  for (var i = 0; i < S.runs.length; i++) if (S.runs[i].id === id) return S.runs[i];
  return {};
}
function conn(ok) {
  S.fails = ok ? 0 : S.fails + 1;
  $("#conn").hidden = S.fails < 2;   /* one blip is not worth a message */
}

/* ── the nine-stage tape ────────────────────────────────────────────────────
   Mirrors runner.py STAGE_NAMES. Parse fail-closed: a confidently wrong progress
   bar is worse than none, and the tape never animates backwards. */
var STAGE_LABELS = ["route", "plan", "cite", "write", "refine",
                    "review", "figures", "latex", "experiment"];
var STAGE_N = STAGE_LABELS.length;

function parseStage(str) {
  var s = String(str === null || str === undefined ? "" : str).trim();
  var m = /^(\d+)\s+(.+)$/.exec(s);
  if (m) {
    var i = parseInt(m[1], 10);
    return { idx: Math.max(0, Math.min(STAGE_N - 1, i)), name: m[2] };
  }
  if (!s || s === "not started") return { idx: -1, name: "" };
  return null;                      /* unparseable → the foot rule renders alone */
}

function tapeKinds(status, idx) {
  var out = [], i;
  for (i = 0; i < STAGE_N; i++) {
    if (status === "done") { out.push("done ok"); continue; }
    if (idx < 0) { out.push("pend"); continue; }
    if (i < idx) out.push("done");
    else if (i === idx) out.push(status === "error" ? "cur err"
                              : status === "stopped" ? "cur grey"
                              : status === "waiting" ? "cur wait" : "cur");
    else out.push("pend");
  }
  return out;
}

function microTape(r) {
  var p = parseStage(r.stage);
  if (!p) return '<span class="mtape"></span>';
  var kinds = tapeKinds(r.status, p.idx), out = "", i;
  for (i = 0; i < STAGE_N; i++) {
    var k = kinds[i];
    var c = k.indexOf("done ok") === 0 ? "ok"
          : k === "done" ? "done"
          : k === "cur" ? "cur"
          : k === "cur wait" ? "wait"
          : k === "cur err" ? "err"
          : k === "cur grey" ? "done" : "";
    out += '<i class="' + c + '"></i>';
  }
  return '<span class="mtape">' + out + "</span>";
}

/* ── the run switcher — this is the run list, and the only one ───────────── */
var RANK = { waiting: 0, running: 1, starting: 1, error: 2, stopped: 3, done: 4 };

function renderRail() {
  var runs = S.runs.slice().sort(function (a, b) {
    if (!!b.needs_reply - !!a.needs_reply) return !!b.needs_reply - !!a.needs_reply;
    var ra = RANK[a.status] === undefined ? 5 : RANK[a.status];
    var rb = RANK[b.status] === undefined ? 5 : RANK[b.status];
    if (ra !== rb) return ra - rb;
    return (toMs(b.started) || 0) - (toMs(a.started) || 0);
  });
  var html = runs.map(function (r) {

function doctorBanner() {

function renderDoctor() {
  var d = S.doctor;
  if (!d) return;
  function one(x) {
    if (!x || !x.present) return { t: t("doctor.absent"), c: "bad", full: t("doctor.notOnPath") };
    /* The probe returns a whole banner line — "Latexmk, John Collins, 9 Mar 2026,
       Version 4.88". Truncating that shows the author, so take the version token. */
    var v = String(x.version || "");
    var m = v.match(/\d+\.[\d.]*\d/g);
    return { t: m ? m[m.length - 1] : (v || t("doctor.present")).slice(0, 24), c: "ok", full: v || t("doctor.present") };
  }

      return ledgerRow(r[0], r[1].t, r[1].full);
    }).join("") + (S.runsDir ? ledgerRow("runs", elidePath(S.runsDir), S.runsDir) : "");

/* A long Windows path wrapped mid-word in a 264px column. Elide the middle and
   keep the whole thing in the tooltip. */
function elidePath(p) {
  p = String(p || "");
  if (p.length <= 22) return p;
  var parts = p.split(/[\\/]/).filter(Boolean);
  if (parts.length < 3) return "…" + p.slice(-20);
  return "…\\" + parts.slice(-2).join("\\");
}

/* Three lamps in the head strip: the environment is either fine and silent, or
   it is the first thing you see. */
function renderLamps(rows) {
  var el = $("#lamps");
  if (!el) return;
  /* Three unlabeled bars read as a mystery. Say it in words: the environment is
     ready, or name what is missing. */
  var bad = rows.filter(function (r) { return r[1].c === "bad"; });
  var tip = rows.map(function (r) { return r[0] + " · " + (r[1].full || r[1].t); }).join("\n");
  if (bad.length) {
    el.className = "envchip bad";
    el.textContent = t("env.missingPre") + bad.map(function (r) { return r[0]; }).join(", ") + t("env.missingPost");
  } else {
    el.className = "envchip ok";
    el.textContent = t("env.ready");
  }
  el.title = tip;
}

var PANES = ["stream", "figures", "tree"];
